# Apply only during cutover. The existing Cloudflare tunnel already resolves
# `web:8080` on this external network, so the native frontend Nginx becomes the
# route surface directly; no replacement Caddy/business gateway is introduced.
services:
  frontend:
    networks:
      WeKnora-network: {}
      edge:
        aliases:
          - web

networks:
  edge:
    external: true
    name: musnow-production_edge
