name: One-shot document card core parity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/document-card-core-parity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore core card business behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('weknora/frontend/src/views/knowledge/components/DocumentCardView.vue')
          s = p.read_text()
          s = s.replace('  canDownload: boolean\n', '', 1)
          s = s.replace("action: 'download' | 'edit'", "action: 'edit'", 1)

          old = "const cardSummary = (item: KnowledgeCard) => item.description || item.metadata?.summary || item.metadata?.content || '暂无内容摘录...'"
          if old in s:
            s = s.replace(old, """const cardSummary = (item: KnowledgeCard) => item.description || item.metadata?.summary || item.metadata?.content || ''
const cardTypeLabel = (item: KnowledgeCard) => {
  if (item.type === 'url') return t('knowledgeBase.typeURL') || 'URL'
  if (item.type === 'manual') return t('knowledgeBase.typeManual')
  if (item.file_type) return String(item.file_type).replace(/^\\./, '').toUpperCase()
  return '--'
}
const inFlightStatusText = (item: KnowledgeCard) => {
  if (item.parse_status === 'finalizing') {
    if (item.summary_status === 'pending' || item.summary_status === 'processing') return t('knowledgeBase.generatingSummary')
    return t('knowledgeBase.statusFinalizing')
  }
  return t('knowledgeBase.parsingInProgress')
}""", 1)

          a = s.find('const runAction = (')
          b = s.find('\n\nconst openFolderPicker', a)
          if a < 0 or b < 0: raise SystemExit('runAction range missing')
          s = s[:a] + '''const runAction = (action: 'edit' | 'view-trace' | 'reparse' | 'cancel-parse' | 'move' | 'batch-manage' | 'delete', item: KnowledgeCard) => {
  const fileName = item.file_name || cardTitle(item)
  if (action === 'delete' && !window.confirm(t('knowledgeBase.confirmDeleteDocument', { fileName }))) return
  if (action === 'cancel-parse' && !window.confirm(t('knowledgeBase.cancelParseConfirmBody', { title: fileName }))) return
  if (action === 'reparse' && !isParseInFlight(item.parse_status) && !window.confirm(t('knowledgeBase.rebuildConfirm', { fileName }))) return
  if (action === 'move') { emit('action', 'move', item); return }
  emit('action', action, item)
  closeMenu(item)
}''' + s[b:]

          s = s.replace('v-if="canEdit || canDownload" class="reference-document-card__menu-anchor"', 'v-if="canEdit" class="reference-document-card__menu-anchor"', 1)
          s = re.sub(r'''\n\s*<button\n\s*v-if="canDownload && \(item\.type === 'file' \|\| item\.type === 'manual'\)".*?</button>''', '', s, count=1, flags=re.S)

          trace = '''                <button
                  v-if="canEdit && isTraceVisible(item)"'''
          if "runAction('edit', item)" not in s and trace in s:
            s = s.replace(trace, '''                <button
                  v-if="item.type === 'manual'"
                  type="button"
                  class="reference-menu-item"
                  @click="runAction('edit', item)"
                >
                  <ReferenceIcon name="edit-2" :size="14" class="reference-menu-icon" />
                  <span>{{ t('knowledgeBase.editDocument') }}</span>
                </button>
''' + trace, 1)

          old_status = '''        <p class="reference-document-card__summary">{{ cardSummary(item) }}</p>

        <div v-if="isParseInFlight(item.parse_status)" class="reference-status-badge reference-status-badge--working">
          <ReferenceIcon name="loader-circle" :size="10" class="reference-spin" />
          <span>{{ item.parse_status === 'finalizing' ? '优化中 📈' : '解析中' }}</span>
        </div>
        <div v-else-if="item.parse_status === 'failed'" class="reference-status-badge reference-status-badge--failed">
          <span>解析失败</span>
        </div>'''
          if old_status in s:
            s = s.replace(old_status, '''        <p v-if="item.parse_status === 'completed' && !['pending', 'processing'].includes(String(item.summary_status || '')) && cardSummary(item)" class="reference-document-card__summary">{{ cardSummary(item) }}</p>

        <button v-if="isParseInFlight(item.parse_status)" type="button" class="reference-status-badge reference-status-badge--working reference-status-action" @click.stop="runAction('view-trace', item)">
          <ReferenceIcon name="loader-circle" :size="10" class="reference-spin" />
          <span>{{ inFlightStatusText(item) }}</span>
        </button>
        <button v-else-if="item.parse_status === 'failed'" type="button" class="reference-status-badge reference-status-badge--failed reference-status-action" @click.stop="runAction('view-trace', item)">
          <span>{{ t('knowledgeBase.parsingFailed') }}</span>
        </button>
        <div v-else-if="item.parse_status === 'draft'" class="reference-status-badge reference-status-badge--draft">
          <span>{{ t('knowledgeBase.draft') }}</span>
        </div>
        <div v-else-if="item.parse_status === 'completed' && ['pending', 'processing'].includes(String(item.summary_status || ''))" class="reference-status-badge reference-status-badge--working">
          <ReferenceIcon name="loader-circle" :size="10" class="reference-spin" />
          <span>{{ t('knowledgeBase.generatingSummary') }}</span>
        </div>''', 1)

          ext = '<span class="reference-document-card__extension">{{ getExtension(item) }}</span>'
          if ext in s and 'cardTypeLabel(item)' in s:
            s = s.replace(ext, '<span class="reference-document-card__extension">{{ cardTypeLabel(item) }}</span>', 1)
          if 'reference-status-badge--draft' not in s:
            marker = '.reference-status-badge--failed { color: #dc2626; background: #fef2f2; border: 1px solid #fecaca; }'
            if marker in s:
              s = s.replace(marker, '.reference-status-action { border: 0; cursor: pointer; text-align: left; font-family: inherit; }\n.reference-status-action:hover { filter: brightness(.96); }\n.reference-status-badge--draft { color: #b45309; background: #fffbeb; border: 1px solid rgb(253 230 138 / .8); }\n' + marker, 1)

          for good in ["runAction('edit', item)", 'knowledgeBase.cancelParseConfirmBody', 'knowledgeBase.rebuildConfirm', 'knowledgeBase.statusFinalizing']:
            if good not in s: raise SystemExit(f'missing required behavior: {good}')
          p.write_text(s)
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "musuw-business-parity"
          git config user.email "actions@users.noreply.github.com"
          git add weknora/frontend/src/views/knowledge/components/DocumentCardView.vue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: restore document card core behavior"
          git push origin HEAD:main
