name: Deploy storefront

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      immutable_ref:
        description: Full commit SHA to build and deploy (must belong to main)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: storefront-production
  # Cloudflare mutation must finish its smoke probe and retain rollback evidence.
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify storefront
    # A workflow_run is emitted for every completed CI attempt.  Only the
    # canonical repository's successful CI run may select its immutable
    # head_sha; dispatch remains an explicit, separately re-checked path.
    if: >-
      github.repository == 'estromeglovettgen-coder/musuw' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'CI' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.repository.full_name == 'estromeglovettgen-coder/musuw'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.immutable_ref }}
          fetch-depth: 0
          # Read-only checkout credentials are needed for the origin/main
          # ancestry proof; this workflow has no write permission.
          persist-credentials: true
      - name: Resolve and verify immutable storefront revision
        id: resolve
        env:
          REQUESTED_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.immutable_ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          EVENT_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_WORKFLOW_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_REF:?immutable storefront ref is required}"
          if [ "$EVENT_NAME" = workflow_run ]; then
            test "$EVENT_REPOSITORY" = estromeglovettgen-coder/musuw
            test "$EVENT_WORKFLOW_REPOSITORY" = estromeglovettgen-coder/musuw
            test "$EVENT_WORKFLOW_NAME" = CI
            test "$EVENT_WORKFLOW_CONCLUSION" = success
            test "$EVENT_WORKFLOW_HEAD_BRANCH" = main
            test "$requested" = "$EVENT_WORKFLOW_HEAD_SHA"
            [[ "$requested" =~ ^[0-9a-fA-F]{40}$ || "$requested" =~ ^[0-9a-fA-F]{64}$ ]]
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$EVENT_REF" = refs/heads/main
            [[ "$requested" =~ ^[0-9a-fA-F]{40}$ || "$requested" =~ ^[0-9a-fA-F]{64}$ ]]
          else
            echo "unsupported deploy event: $EVENT_NAME" >&2
            exit 1
          fi
          selected_sha="$(git rev-parse "$requested^{commit}")"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$selected_sha"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$actual" refs/remotes/origin/main
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            runs="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$actual&per_page=100")"
            jq -e --arg sha "$actual" '
              [.workflow_runs[]? | select(.name == "CI" and .head_sha == $sha and .conclusion == "success")] | length > 0
            ' <<<"$runs" >/dev/null
          fi
          {
            printf 'release_sha=%s\n' "$actual"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - name: Install storefront dependencies
        run: npm ci --prefix storefront --ignore-scripts
      - name: Run storefront tests and build
        run: npm --prefix storefront test
      - name: Validate Wrangler bundle without uploading
        working-directory: storefront
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Preserve the tested static bundle
        uses: actions/upload-artifact@v4
        with:
          name: storefront-dist
          path: storefront/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy storefront Worker
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert deploy checkout matches build SHA
        env:
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - name: Install Wrangler from the locked storefront manifest
        run: npm ci --prefix storefront --ignore-scripts
      - name: Restore the tested static bundle
        uses: actions/download-artifact@v4
        with:
          name: storefront-dist
          path: storefront/dist
      - name: Confirm the artifact is complete
        run: test -s storefront/dist/index.html
      - name: Capture Wrangler version and previous deployment
        id: preflight
        working-directory: storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler --version | tee "$RUNNER_TEMP/musuw-wrangler-version.txt"
          npx wrangler deployments list --json --config wrangler.jsonc | tee "$RUNNER_TEMP/musuw-storefront-previous-deployments.json"
          jq -e 'type == "array"' "$RUNNER_TEMP/musuw-storefront-previous-deployments.json" >/dev/null
          previous_version_id="$(jq -er '
            [ .[] | select((.versions // []) | length > 0) ]
            | sort_by(.created_on)
            | last
            | .versions[]
            | select((.percentage // 0) == 100)
            | .version_id
          ' "$RUNNER_TEMP/musuw-storefront-previous-deployments.json")"
          [[ "$previous_version_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          printf 'previous_version_id=%s\n' "$previous_version_id" >> "$GITHUB_OUTPUT"
      - name: Deploy the storefront only
        id: deploy_worker
        working-directory: storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: |
          set -euo pipefail
          if ! npx wrangler deploy --strict --config wrangler.jsonc \
            --message "musuw storefront $RELEASE_SHA" \
            --tag "github-$RELEASE_SHA" 2>&1 | tee "$RUNNER_TEMP/musuw-storefront-deploy.log"; then
            {
              printf 'storefront deploy failed for %s\n' "$RELEASE_SHA"
              printf 'previous deployment snapshot:\n'
              cat "$RUNNER_TEMP/musuw-storefront-previous-deployments.json"
              printf 'deploy log:\n'
              cat "$RUNNER_TEMP/musuw-storefront-deploy.log"
              printf 'rollback evidence: redeploy the prior Cloudflare version from the captured snapshot.\n'
            } > "$RUNNER_TEMP/musuw-storefront-rollback-evidence.txt"
            exit 1
          fi
          npx wrangler deployments list --json --config wrangler.jsonc | tee "$RUNNER_TEMP/musuw-storefront-current-deployments.json"
      - name: Smoke-test public storefront aliases and locale
        id: smoke
        env:
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/musuw-storefront-smoke.txt"
          for origin in https://musuw.com https://www.musuw.com; do
            headers="$RUNNER_TEMP/musuw-headers-${origin#https://}.txt"
            body="$RUNNER_TEMP/musuw-body-${origin#https://}.html"
            curl --fail --silent --show-error --retry 8 --retry-delay 3 --connect-timeout 10 --max-time 30 \
              -D "$headers" -o "$body" "$origin/"
            grep -Eiq '^content-language:[[:space:]]*(en|zh-CN)' "$headers"
            grep -Eiq '<html[^>]+lang="(en|zh-CN)"' "$body"
            grep -Eiq 'window\.__MUSUW_LOCALE__[[:space:]]*=[[:space:]]*"(en|zh-CN)"' "$body"
            printf '%s release=%s content-language=%s\n' "$origin" "$RELEASE_SHA" "$(grep -i '^content-language:' "$headers" | tr -d '\r' | tr '\n' ' ')" | tee -a "$RUNNER_TEMP/musuw-storefront-smoke.txt"
          done
          # The product handoff is a separate service; this is only a reachability
          # probe and deliberately does not mutate or assert its application UI.
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --connect-timeout 10 --max-time 30 \
            -D "$RUNNER_TEMP/musuw-app-auth-start-headers.txt" -o /dev/null https://app.musuw.com/auth/start
      - name: Roll back Cloudflare Worker after deploy or smoke failure
        if: failure()
        working-directory: storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION_ID: ${{ steps.preflight.outputs.previous_version_id }}
        run: |
          set -euo pipefail
          [[ "$PREVIOUS_VERSION_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          rollback_status=0
          npx wrangler rollback "$PREVIOUS_VERSION_ID" --yes \
            --message "musuw storefront rollback after failed deploy/smoke" 2>&1 | tee "$RUNNER_TEMP/musuw-storefront-rollback.log" || rollback_status=$?
          if [ "$rollback_status" -ne 0 ]; then
            {
              printf 'automatic Cloudflare rollback FAILED for version %s (status %s)\n' "$PREVIOUS_VERSION_ID" "$rollback_status"
              cat "$RUNNER_TEMP/musuw-storefront-rollback.log"
            } > "$RUNNER_TEMP/musuw-storefront-rollback-evidence.txt"
            exit 1
          fi
          reprobe_status=0
          for origin in https://musuw.com https://www.musuw.com; do
            if ! curl --fail --silent --show-error --retry 8 --retry-delay 3 --connect-timeout 10 --max-time 30 \
              -D "$RUNNER_TEMP/musuw-rollback-headers-${origin#https://}.txt" -o /dev/null "$origin/"; then
              reprobe_status=1
            fi
          done
          {
            printf 'automatic Cloudflare rollback completed to version %s; reprobe_status=%s\n' "$PREVIOUS_VERSION_ID" "$reprobe_status"
            cat "$RUNNER_TEMP/musuw-storefront-rollback.log"
          } > "$RUNNER_TEMP/musuw-storefront-rollback-evidence.txt"
          # Preserve the failed deployment/smoke status after proving recovery.
          exit 1
      - name: Write storefront release manifest and checksum
        if: always()
        env:
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
          SOURCE_EVENT_SHA: ${{ needs.build.outputs.release_sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          source_manifest='third_party/weknora/active-upstream-source.json'
          source_checksum=''
          if [ -f "$source_manifest" ]; then
            source_checksum="$(sha256sum "$source_manifest" | awk '{print $1}')"
          fi
          wrangler_version=''
          [ -f "$RUNNER_TEMP/musuw-wrangler-version.txt" ] && wrangler_version="$(tr '\n' ' ' < "$RUNNER_TEMP/musuw-wrangler-version.txt")"
          previous_json='[]'
          current_json='[]'
          [ -s "$RUNNER_TEMP/musuw-storefront-previous-deployments.json" ] && previous_json="$(cat "$RUNNER_TEMP/musuw-storefront-previous-deployments.json")"
          [ -s "$RUNNER_TEMP/musuw-storefront-current-deployments.json" ] && current_json="$(cat "$RUNNER_TEMP/musuw-storefront-current-deployments.json")"
          jq -n \
            --arg schema_version 'musuw.release.v1' \
            --arg commit_sha "$RELEASE_SHA" \
            --arg source_event_sha "$SOURCE_EVENT_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_run "$WORKFLOW_RUN" \
            --arg workflow_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg wrangler_version "$wrangler_version" \
            --arg source_manifest "$source_manifest" \
            --arg source_manifest_sha256 "$source_checksum" \
            --argjson previous "$previous_json" \
            --argjson current "$current_json" \
            '{schema_version:$schema_version,commit_sha:$commit_sha,source_event_sha:$source_event_sha,repository:$repository,workflow:"Deploy storefront",workflow_run:$workflow_run,workflow_attempt:$workflow_attempt,wrangler_version:$wrangler_version,source_manifest:$source_manifest,source_manifest_sha256:$source_manifest_sha256,cloudflare_previous_deployments:$previous,cloudflare_current_deployments:$current,server_release_id:null,server_source_bundle_sha256:null}' \
            > "$RUNNER_TEMP/musuw-storefront-release-manifest.json"
          sha256sum "$RUNNER_TEMP/musuw-storefront-release-manifest.json" > "$RUNNER_TEMP/musuw-storefront-release-manifest.json.sha256"
      - name: Upload storefront release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-release-${{ needs.build.outputs.release_sha }}
          path: |
            ${{ runner.temp }}/musuw-wrangler-version.txt
            ${{ runner.temp }}/musuw-storefront-previous-deployments.json
            ${{ runner.temp }}/musuw-storefront-current-deployments.json
            ${{ runner.temp }}/musuw-storefront-deploy.log
            ${{ runner.temp }}/musuw-storefront-smoke.txt
            ${{ runner.temp }}/musuw-storefront-rollback-evidence.txt
            ${{ runner.temp }}/musuw-storefront-release-manifest.json
            ${{ runner.temp }}/musuw-storefront-release-manifest.json.sha256
          if-no-files-found: warn
          retention-days: 30
