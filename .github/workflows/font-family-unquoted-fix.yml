name: One-shot unquoted Fontsource family parity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/font-family-unquoted-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair unquoted Inter stacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('weknora/frontend/src')
          changed = 0
          for p in root.rglob('*'):
            if not p.is_file() or p.suffix not in {'.vue', '.css', '.less', '.ts', '.tsx'}:
              continue
            try: s = p.read_text()
            except UnicodeDecodeError: continue
            old = s
            s = s.replace('font-family: Inter, "Noto Sans SC", ui-sans-serif', 'font-family: "Inter Variable", Inter, "Noto Sans SC Variable", "Noto Sans SC", ui-sans-serif')
            s = s.replace('font-family:Inter,"Noto Sans SC",ui-sans-serif', 'font-family:"Inter Variable",Inter,"Noto Sans SC Variable","Noto Sans SC",ui-sans-serif')
            if s != old:
              p.write_text(s)
              changed += 1
          if changed == 0:
            raise SystemExit('no remaining unquoted Inter stacks found')
          manual = Path('weknora/frontend/src/components/manual-knowledge-editor.vue').read_text()
          if 'font-family: Inter, "Noto Sans SC"' in manual:
            raise SystemExit('manual editor still uses unresolved Inter family')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "musuw-visual-parity"
          git config user.email "actions@users.noreply.github.com"
          git add weknora/frontend/src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: finish Fontsource family alignment"
          git push origin HEAD:main
