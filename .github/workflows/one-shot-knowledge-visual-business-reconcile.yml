name: One-shot knowledge visual/business reconcile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-knowledge-visual-business-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build active knowledge page from upstream business + reference presentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import re

          root = Path('weknora/frontend/src')
          active = root / 'views/knowledge/KnowledgeBase.vue'
          donor = root / 'views/knowledge/KnowledgeBaseMechanical.vue'
          app_path = root / 'App.vue'
          icon_path = root / 'components/ReferenceIcon.vue'
          upload_path = root / 'views/knowledge/components/KbUploadSourceDropdown.vue'

          upstream_url = 'https://raw.githubusercontent.com/Tencent/WeKnora/3d5d8bfcdfeeea266b292b71cea616847af28d0f/frontend/src/views/knowledge/KnowledgeBase.vue'
          upstream = urlopen(upstream_url, timeout=30).read().decode('utf-8')
          if '</script>' not in upstream:
              raise SystemExit('cannot read exact upstream KnowledgeBase.vue')
          script = upstream[:upstream.index('</script>') + len('</script>')]

          # Presentation comes from the source-level visual transplant. This also
          # survives a concurrent earlier workflow that may already have deleted
          # KnowledgeBaseMechanical.vue and copied its template into the active file.
          presentation_source = donor.read_text() if donor.exists() else active.read_text()
          tpos = presentation_source.find('<template>')
          if tpos < 0 or 'reference-kb-page' not in presentation_source[tpos:]:
              raise SystemExit('reference knowledge presentation is unavailable')
          presentation = presentation_source[tpos:]

          # Only presentation adapters may be added to the upstream business script.
          anchor = "import KBSwitcherDropdown from '@/components/KBSwitcherDropdown.vue';\n"
          if anchor not in script:
              raise SystemExit('upstream KB switcher import anchor changed')
          script = script.replace(anchor, anchor + "import ReferenceIcon from '@/components/ReferenceIcon.vue';\n", 1)

          # Reference tabs visibly include real document/wiki/graph counts. Read
          # those from the same upstream getWikiStats request; no mock state/API.
          counter_anchor = "const wikiIsIndexing = computed(() => wikiStatus.value.isActive || wikiStatus.value.pendingTasks > 0)\n"
          if counter_anchor not in script:
              raise SystemExit('upstream wiki status anchor changed')
          script = script.replace(counter_anchor, "const wikiCount = ref(0)\nconst graphCount = ref(0)\n" + counter_anchor, 1)
          data_anchor = "    const data = res?.data || res\n    if (!data) return\n"
          if data_anchor not in script:
              raise SystemExit('upstream wiki stats response anchor changed')
          script = script.replace(data_anchor, data_anchor + "    wikiCount.value = Number(data.total_pages || 0)\n    graphCount.value = Number(data.total_links || 0)\n", 1)

          # Every reference control delegates to the upstream handler/state path.
          wiring = {
              '@select="handleKnowledgeDropdownSelect"': '@select="(id) => handleKnowledgeDropdownSelect({ value: id })"',
              '@open-source-doc="(id) => openKnowledgeItem({ id })"': '@open-source-doc="openSourceDoc"',
              '@status-change="refreshWikiStats"': '@status-change="onWikiStatusChange"',
              '@files="uploadFiles"': '@files="handleUploadSourceFiles"',
              '@url="importUrl"': '@url="handleUploadSourceUrl"',
              '@manual="createManual"': '@manual="handleManualCreate"',
              '@toggle-checkbox="(id, checked) => toggleRow(id, checked)"': '@toggle-checkbox="onCardGridCheckboxChange"',
              '@menu-visible-change="(visible, item) => visible && probeTraceAvailable(item)"': '@menu-visible-change="onCardMoreVisibleChange"',
              '@toggle-row="toggleRow"': '@toggle-row="toggleSelectRow"',
              '@toggle-all="toggleAll"': '@toggle-all="toggleSelectAll"',
              '@cancel="cancelBatch"': '@cancel="handleBatchCancel"',
              '@delete="deleteBatch"': '@delete="confirmBatchDelete"',
              '@reparse="reparseBatch"': '@reparse="confirmBatchReparse"',
              '@batch-tag="batchTag"': '@batch-tag="handleBatchTag"',
              '@tag-created="loadTags"': '@tag-created="() => loadTags(kbId, true)"',
              '@open-manage="tagManageDrawerVisible = true"': '@open-manage="openTagManageFromEditDialog"',
              '@changed="() => { loadTags(); loadKnowledgeFiles() }"': '@changed="onTagManageChanged"',
          }
          for before, after in wiring.items():
              presentation = presentation.replace(before, after)

          # List and grid differ in their upstream action bridge.
          list_probe = '@probe-trace="probeTraceAvailable"'
          if list_probe in presentation:
              before = presentation[:presentation.index(list_probe)]
              idx = before.rfind('@action="handleCardAction"')
              if idx >= 0:
                  presentation = presentation[:idx] + '@action="handleListAction"' + presentation[idx+len('@action="handleCardAction"'):]

          # Reference tag chips must invoke upstream selection behavior, not mutate
          # only the local array and skip resets/pagination.
          presentation = re.sub(
              r'@click="selectedTagIds\s*=\s*selectedTagIds\.includes\(tag\.id\)[\s\S]*?\[\.\.\.selectedTagIds,\s*tag\.id\]"',
              '@click="handleTagRowClick(tag.id)"',
              presentation,
          )
          presentation = presentation.replace(':class="{ active: selectedTagIds.includes(tag.id) }"', ':class="{ active: isTagFilterActive(tag.id) }"')

          # Restore upstream DocContent synchronization if donor omitted it.
          if 'summaryStateChange="syncDocumentSummaryState"' not in presentation and 'summary-state-change="syncDocumentSummaryState"' not in presentation:
              presentation = presentation.replace('@getDoc="getDoc"\n    />', '@getDoc="getDoc"\n      @summaryStateChange="syncDocumentSummaryState"\n    />', 1)

          # Preserve real WeKnora KB information/settings/parser/storage actions,
          # visually integrated rather than dropped from the reference shell.
          header_marker = "        <p>{{ $t('knowledgeEditor.document.subtitle') }}</p>\n      </div>"
          if header_marker in presentation and 'reference-kb-project-actions' not in presentation:
              header = """        <p>{{ $t('knowledgeEditor.document.subtitle') }}</p>
        <div class="reference-kb-project-actions">
          <KBInfoPopover v-if="kbInfo && !authStore.isLiteMode" :kb-info="kbInfo" :supported-file-types="[...supportedFileTypes]" />
          <button v-if="canManage" type="button" class="reference-kb-project-action" :title="$t('knowledgeBase.settings')" :disabled="!kbId" @click="handleOpenKBSettings">
            <ReferenceIcon name="settings" :size="14" />
          </button>
        </div>
        <button v-if="unsupportedFileTypes.length" type="button" class="reference-kb-inline-warning" @click="goToParserSettings">
          <ReferenceIcon name="info" :size="13" />
          <span>{{ $t('knowledgeBase.unsupportedTypesHint', { types: unsupportedFileTypes.map(t => '.' + t).join('、') }) }}</span>
          <strong>{{ $t('knowledgeBase.goToParserSettings') }} →</strong>
        </button>
        <button v-if="missingStorageEngine" type="button" class="reference-kb-inline-warning" @click="handleOpenKBSettings">
          <ReferenceIcon name="info" :size="13" />
          <span>{{ $t('knowledgeBase.missingStorageEngine') }}</span>
          <strong>{{ $t('knowledgeBase.goToStorageSettings') }} →</strong>
        </button>
      </div>"""
              presentation = presentation.replace(header_marker, header, 1)

          # The visual authority's empty state exposes a real upload CTA. Point it
          # to the same upload dropdown/file input, which then enters upstream
          # upload confirmation through handleUploadSourceFiles.
          old_empty = '''          <div v-else-if="!docListLoading" class="reference-empty-state">
            <ReferenceIcon name="file-text" :size="38" :stroke-width="1.5" />
            <strong>暂无文档</strong>
          </div>'''
          if old_empty in presentation:
              presentation = presentation.replace(old_empty, '''          <div v-else-if="!docListLoading" class="reference-empty-state">
            <ReferenceIcon name="file-text" :size="40" :stroke-width="1" />
            <strong>未找到符合条件的文档</strong>
            <p>当前目录下暂无匹配文档，可以点击右上角「添加文档」上传或导入新内容。</p>
            <button v-if="canEdit" type="button" class="reference-empty-state__upload" @click="uploadSourceRef?.openFilePicker?.()">
              <ReferenceIcon name="upload" :size="14" />
              <span>立即上传文档</span>
            </button>
          </div>''', 1)

          # Retain upstream settings modal if the donor had not carried it over.
          if '<KnowledgeBaseEditorModal' not in presentation:
              root_close = '\n  </div>\n</template>'
              editor = '''
    <KnowledgeBaseEditorModal
      :visible="uiStore.showKBEditorModal"
      :mode="uiStore.kbEditorMode"
      :kb-id="uiStore.currentKBId || undefined"
      :initial-type="uiStore.kbEditorType"
      @update:visible="(value) => value ? null : uiStore.closeKBEditor()"
      @success="handleKBEditorSuccess"
    />
'''
              pos = presentation.rfind(root_close)
              if pos < 0:
                  raise SystemExit('reference template root close not found')
              presentation = presentation[:pos] + editor + presentation[pos:]

          # Style only the retained upstream actions with reference primitives.
          if 'reference-kb-project-actions {' not in presentation:
              css = r'''
.reference-kb-header__copy { position: relative; }
.reference-kb-project-actions { position: absolute; left: calc(100% + 10px); top: 0; display: flex; align-items: center; gap: 4px; }
.reference-kb-project-action { width: 28px; height: 28px; padding: 0; border: 1px solid #e5e7eb; border-radius: 9px; background: #fff; color: #6b7280; display: grid; place-items: center; cursor: pointer; }
.reference-kb-project-action:hover { background: #f3f4f6; color: #111827; }
.reference-kb-inline-warning { max-width: 760px; margin: 4px 0 0; padding: 0; border: 0; background: transparent; color: #9ca3af; display: flex; align-items: center; gap: 5px; font: inherit; font-size: 10px; line-height: 14px; text-align: left; cursor: pointer; }
.reference-kb-inline-warning strong { color: #6b7280; font-weight: 700; white-space: nowrap; }
.reference-empty-state p { max-width: 360px; margin: 0; color: #9ca3af; font-size: 12px; line-height: 18px; text-align: center; }
.reference-empty-state__upload { margin-top: 8px; height: 32px; padding: 0 16px; border: 0; border-radius: 12px; background: #111827; color: #fff; display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.reference-empty-state__upload:hover { background: #000; }
'''
              spos = presentation.rfind('</style>')
              if spos < 0:
                  raise SystemExit('reference style close not found')
              presentation = presentation[:spos] + css + presentation[spos:]

          # Add exact Lucide paths required by retained business affordances.
          icons = icon_path.read_text()
          union_anchor = "    | 'upload'"
          for name in ['info', 'settings']:
              if f"| '{name}'" not in icons:
                  icons = icons.replace(union_anchor, f"    | '{name}'\n" + union_anchor, 1)
          if "name === 'info'" not in icons:
              icons = icons.replace("    <template v-else-if=\"name === 'layout-grid'\">", "    <template v-else-if=\"name === 'info'\">\n      <circle cx=\"12\" cy=\"12\" r=\"10\" />\n      <path d=\"M12 16v-4\" />\n      <path d=\"M12 8h.01\" />\n    </template>\n    <template v-else-if=\"name === 'layout-grid'\">", 1)
          if "name === 'settings'" not in icons:
              icons = icons.replace("    <template v-else-if=\"name === 'search'\">", "    <template v-else-if=\"name === 'settings'\">\n      <path d=\"M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z\" />\n      <circle cx=\"12\" cy=\"12\" r=\"3\" />\n    </template>\n    <template v-else-if=\"name === 'search'\">", 1)
          icon_path.write_text(icons)

          active.write_text(script + '\n\n' + presentation)

          # Restore exact upstream upload-confirm host in Musuw's adapted App shell.
          app = app_path.read_text()
          host_import = 'import UploadConfirmHost from "@/components/UploadConfirmHost.vue";\n'
          manual_import = 'import ManualKnowledgeEditor from "@/components/manual-knowledge-editor.vue";\n'
          if host_import not in app:
              if manual_import not in app:
                  raise SystemExit('App upload host import anchor missing')
              app = app.replace(manual_import, manual_import + host_import, 1)
          if '<UploadConfirmHost />' not in app:
              app = app.replace('      <ManualKnowledgeEditor />', '      <ManualKnowledgeEditor />\n      <UploadConfirmHost />', 1)
          app_path.write_text(app)

          # Empty-state upload CTA reuses the component's real file input.
          upload = upload_path.read_text()
          if 'const openFilePicker = () =>' not in upload:
              ua = "const openUrlDialog = () => {\n"
              if ua not in upload:
                  raise SystemExit('upload source expose anchor missing')
              upload = upload.replace(ua, "const openFilePicker = () => fileInputRef.value?.click()\n\n" + ua, 1)
          upload = upload.replace('defineExpose({ openUrlDialog })', 'defineExpose({ openUrlDialog, openFilePicker })')
          upload_path.write_text(upload)

          # Remove obsolete staging source after one authoritative page exists.
          if donor.exists(): donor.unlink()

          # Replace stale tests that previously required bypassing upstream config.
          Path('weknora/frontend/src/views/knowledge/KnowledgeBase.test.mjs').write_text(r'''import assert from "node:assert/strict";
import { readFileSync } from "node:fs";
import test from "node:test";
const source = readFileSync(new URL("./KnowledgeBase.vue", import.meta.url), "utf8");
test("reference knowledge DOM is the active detail UI", () => {
  for (const token of ["reference-kb-header", "reference-kb-tabs", "reference-doc-stage", "reference-toolbar", "reference-document-workspace"]) assert.match(source, new RegExp(token));
});
test("upstream WeKnora business contracts remain authoritative", () => {
  for (const token of ["useUploadConfirmStore", "openUploadConfirmDialog", "handleUploadConfirmResult", "process_config", "confirmRebuildKnowledge", "getKnowledgeDetails", "weknora:knowledge-file-drop", "confirmBatchReparse", "confirmBatchDelete", "handleBatchTag"]) assert.match(source, new RegExp(token));
  for (const token of ["const uploadFiles = async", "const importUrl = async", "const createManual ="]) assert.doesNotMatch(source, new RegExp(token));
});
''')
          Path('weknora/frontend/src/views/knowledge/components/UploadConfirmDialog.test.ts').write_text(r'''import assert from 'node:assert/strict'
import test from 'node:test'
import { readFileSync } from 'node:fs'
const knowledgeBase = readFileSync(new URL('../KnowledgeBase.vue', import.meta.url), 'utf8')
const app = readFileSync(new URL('../../../App.vue', import.meta.url), 'utf8')
test('knowledge uploads use upstream confirmation/process overrides', () => {
  assert.match(knowledgeBase, /useUploadConfirmStore/)
  assert.match(knowledgeBase, /openUploadConfirmDialog/)
  assert.match(knowledgeBase, /handleUploadConfirmResult/)
  assert.match(knowledgeBase, /process_config/)
  assert.match(knowledgeBase, /@files="handleUploadSourceFiles"/)
  assert.match(knowledgeBase, /@url="handleUploadSourceUrl"/)
  assert.match(knowledgeBase, /@manual="handleManualCreate"/)
  assert.match(app, /UploadConfirmHost/)
})
''')

          final = active.read_text()
          required = ['useUploadConfirmStore','openUploadConfirmDialog','handleUploadConfirmResult','process_config','reference-kb-header','reference-toolbar','@toggle-checkbox="onCardGridCheckboxChange"','@action="handleListAction"']
          missing = [x for x in required if x not in final]
          if missing: raise SystemExit('missing contracts: ' + ', '.join(missing))
          PY
      - name: Validate frontend
        working-directory: weknora/frontend
        run: |
          npm ci
          npm test
          npm run type-check
          npm run check-i18n
          npm run build
      - name: Commit reconciled page
        shell: bash
        run: |
          git config user.name "musuw-parity"
          git config user.email "actions@users.noreply.github.com"
          git add -A weknora/frontend/src/App.vue \
                     weknora/frontend/src/components/ReferenceIcon.vue \
                     weknora/frontend/src/views/knowledge/KnowledgeBase.vue \
                     weknora/frontend/src/views/knowledge/KnowledgeBaseMechanical.vue \
                     weknora/frontend/src/views/knowledge/KnowledgeBase.test.mjs \
                     weknora/frontend/src/views/knowledge/components/KbUploadSourceDropdown.vue \
                     weknora/frontend/src/views/knowledge/components/UploadConfirmDialog.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(ui): reconcile knowledge reference UI with upstream behavior"
          git pull --rebase origin main
          git push origin HEAD:main
