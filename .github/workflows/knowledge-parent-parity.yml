name: One-shot knowledge parent parity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/knowledge-parent-parity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove accidental audit-only download path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('weknora/frontend/src/views/knowledge/KnowledgeBase.vue')
          s = p.read_text()
          s = s.replace('  downKnowledgeDetails,\n', '', 1)
          s = s.replace("import { resolveKnowledgeDownloadFileName } from './knowledgeDownloadFileName';\n", '', 1)
          s = re.sub(r"\nconst downloadKnowledge = async \(item: KnowledgeCard\) => \{.*?\n\};\n\n// Bridge card-view actions", '\n// Bridge card-view actions', s, count=1, flags=re.S)
          s = s.replace("action: 'download' | 'edit'", "action: 'edit'", 2)
          s = s.replace("  if (action === 'download') return downloadKnowledge(item);\n", '', 2)
          s = s.replace('                    :can-download="canDownloadKnowledge"\n', '', 1)
          s = s.replace(' :can-download="canDownloadKnowledge"', '', 1)
          for bad in ['downKnowledgeDetails', 'resolveKnowledgeDownloadFileName', 'downloadKnowledge = async', "action: 'download'", ':can-download="canDownloadKnowledge"']:
            if bad in s: raise SystemExit(f'stale accidental parent behavior: {bad}')
          p.write_text(s)
          Path('weknora/frontend/src/views/knowledge/knowledgeDownloadFileName.ts').unlink(missing_ok=True)
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "musuw-business-parity"
          git config user.email "actions@users.noreply.github.com"
          git add -A weknora/frontend/src/views/knowledge
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: remove accidental knowledge download branch"
          git push origin HEAD:main
