name: One-shot document business parity repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/document-business-parity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore pre-visual document behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          # -----------------------------------------------------------------
          # Parent view: undo the accidental latest-upstream download addition.
          # Download was absent from the pinned v0.7.2 authority and from the
          # Musuw components immediately before the visual replacements.
          # -----------------------------------------------------------------
          p = Path('weknora/frontend/src/views/knowledge/KnowledgeBase.vue')
          s = p.read_text()
          s = s.replace('  downKnowledgeDetails,\n', '', 1)
          s = s.replace("import { resolveKnowledgeDownloadFileName } from './knowledgeDownloadFileName';\n", '', 1)
          s, n = re.subn(
              r"\nconst downloadKnowledge = async \(item: KnowledgeCard\) => \{.*?\n\};\n\n// Bridge card-view actions",
              '\n// Bridge card-view actions',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('downloadKnowledge block not found')
          s = s.replace("action: 'download' | 'edit'", "action: 'edit'", 2)
          s = s.replace("  if (action === 'download') return downloadKnowledge(item);\n", '', 2)
          s = s.replace('                    :can-download="canDownloadKnowledge"\n', '', 1)
          s = s.replace(' :can-download="canDownloadKnowledge"', '', 1)
          p.write_text(s)

          # -----------------------------------------------------------------
          # List view: keep the reference DOM but restore the actual pre-visual
          # source/status state machine and action semantics.
          # -----------------------------------------------------------------
          p = Path('weknora/frontend/src/views/knowledge/components/DocumentListView.vue')
          s = p.read_text()
          s = s.replace('  canDownload: boolean\n', '', 1)
          s = s.replace("action: 'download' | 'edit'", "action: 'edit'", 1)

          helper_start = s.index('const sourceInfo =')
          helper_end = s.index('\n\nconst openMenu =', helper_start)
          helpers = '''const sourceInfo = (item: KnowledgeItem): { icon: 'globe' | 'pen-line' | 'upload'; label: string } => {
            const ch = item.channel
            if (ch === 'feishu') return { icon: 'upload', label: t('knowledgeBase.channelFeishu') }
            if (ch === 'feishu_drive') return { icon: 'upload', label: t('knowledgeBase.channelFeishuDrive') }
            if (ch === 'lark_drive') return { icon: 'upload', label: t('knowledgeBase.channelLarkDrive') }
            if (ch === 'notion') return { icon: 'upload', label: t('knowledgeBase.channelNotion') }
            if (ch === 'yuque') return { icon: 'upload', label: t('knowledgeBase.channelYuque') }
            if (ch === 'wechat') return { icon: 'upload', label: t('knowledgeBase.channelWechat') }
            if (ch === 'wecom') return { icon: 'upload', label: t('knowledgeBase.channelWecom') }
            if (ch === 'dingtalk') return { icon: 'upload', label: t('knowledgeBase.channelDingtalk') }
            if (ch === 'slack') return { icon: 'upload', label: t('knowledgeBase.channelSlack') }
            if (ch === 'im') return { icon: 'upload', label: t('knowledgeBase.channelIm') }
            if (item.type === 'url') return { icon: 'globe', label: t('knowledgeBase.channelUrl') }
            if (item.type === 'manual') return { icon: 'pen-line', label: t('knowledgeBase.channelManual') }
            return { icon: 'upload', label: t('knowledgeBase.channelUpload') }
          }
          const statusInfo = (item: KnowledgeItem) => {
            if (item.parse_status === 'pending' || item.parse_status === 'processing') {
              return { tone: 'indexing', label: t('knowledgeBase.statusProcessing'), spinning: true }
            }
            if (item.parse_status === 'finalizing') {
              if (item.summary_status === 'pending' || item.summary_status === 'processing') {
                return { tone: 'indexing', label: t('knowledgeBase.generatingSummary'), spinning: true }
              }
              return { tone: 'indexing', label: t('knowledgeBase.statusFinalizing'), spinning: true }
            }
            if (item.parse_status === 'failed') return { tone: 'failed', label: t('knowledgeBase.statusFailed'), spinning: false }
            if (item.parse_status === 'cancelled') return { tone: 'optimizing', label: t('knowledgeBase.statusCancelled'), spinning: false }
            if (item.parse_status === 'draft') return { tone: 'optimizing', label: t('knowledgeBase.statusDraft'), spinning: false }
            if (item.parse_status === 'completed' && (item.summary_status === 'pending' || item.summary_status === 'processing')) {
              return { tone: 'indexing', label: t('knowledgeBase.generatingSummary'), spinning: true }
            }
            if (item.parse_status === 'completed') return { tone: 'completed', label: t('knowledgeBase.statusCompleted'), spinning: false }
            return { tone: 'neutral', label: '--', spinning: false }
          }'''
          s = s[:helper_start] + helpers + s[helper_end:]

          run_start = s.index('const runAction = (')
          run_end = s.index('\nconst pickFolder =', run_start)
          run = '''const runAction = (action: 'edit' | 'reparse' | 'cancel-parse' | 'move' | 'delete' | 'view-trace' | 'batch-manage', item: KnowledgeItem) => {
            if (action === 'delete' && !window.confirm(t('knowledgeBase.confirmDeleteDocument', { fileName: item.file_name }))) return
            if (action === 'cancel-parse' && !window.confirm(t('knowledgeBase.cancelParseConfirmBody', { title: item.file_name }))) return
            if (action === 'reparse' && !isParseInFlight(item.parse_status) && !window.confirm(t('knowledgeBase.rebuildConfirm', { fileName: item.file_name }))) return
            if (action === 'move') {
              emit('action', action, item)
              return
            }
            emit('action', action, item)
            closeMenu()
          }'''
          s = s[:run_start] + run + s[run_end:]

          s = s.replace('aria-label="全选"', ":aria-label=\"t('knowledgeBase.selectAll')\"", 1)
          for old, key in [
              ('<th>文件名</th>', 'knowledgeBase.columnName'),
              ('<th class="reference-col-tags">标签</th>', 'knowledgeBase.columnTag'),
              ('<th class="reference-col-source">来源</th>', 'knowledgeBase.columnSource'),
              ('<th class="reference-col-size">大小</th>', 'knowledgeBase.columnSize'),
              ('<th class="reference-col-status">状态</th>', 'knowledgeBase.columnStatus'),
              ('<th class="reference-col-time">更新时间</th>', 'knowledgeBase.columnUpdatedAt'),
              ('<th class="reference-col-action">操作</th>', 'knowledgeBase.columnActions'),
          ]:
              s = replace_once(s, old, old.split('>')[0] + ">{{ t('" + key + "') }}</th>", 'header ' + key)
          s = s.replace("<p>{{ item.description || '无提取文本' }}</p>", '<p v-if="item.description">{{ item.description }}</p>', 1)
          s = s.replace('>+ 标签</button>', ">+ {{ t('knowledgeBase.tagLabel') }}</button>", 1)
          s = s.replace('v-if="canEdit || canDownload"', 'v-if="canEdit"', 1)
          s = s.replace('<template v-if="(canEdit || canDownload) && activeMenuItemId === item.id">', '<template v-if="canEdit && activeMenuItemId === item.id">', 1)
          s, n = re.subn(
              r'''\n\s*<button\n\s*v-if="canDownload && \(item\.type === 'file' \|\| item\.type === 'manual'\)".*?</button>''',
              '', s, count=1, flags=re.S,
          )
          if n != 1:
              raise SystemExit('list download menu item not found')
          trace_button = '''                    <button v-if="canEdit && isTraceVisible(item)" type="button" class="reference-list-menu-item" @click="runAction('view-trace', item)">'''
          s = replace_once(
              s,
              trace_button,
              '''                    <button v-if="item.type === 'manual'" type="button" class="reference-list-menu-item" @click="runAction('edit', item)">
                      <ReferenceIcon name="edit-2" :size="14" class="reference-list-menu-icon" />
                      <span>{{ t('knowledgeBase.editDocument') }}</span>
                    </button>
''' + trace_button,
              'list manual edit',
          )
          s = s.replace('<span>查看 Trace</span>', "<span>{{ t('knowledgeStages.viewTrace') }}</span>", 1)
          s = s.replace('<span>停止解析</span>', "<span>{{ t('knowledgeBase.cancelParse') }}</span>", 1)
          s = s.replace('<span>移动到...</span>', "<span>{{ t('knowledgeBase.moveDocument') }}</span>", 1)
          s = s.replace('<div v-if="moveTargetsLoading" class="reference-list-menu-state">加载中...</div>', "<div v-if=\"moveTargetsLoading\" class=\"reference-list-menu-state\">{{ t('common.loading') }}</div>", 1)
          status_css = '.reference-list-status--completed { color: #047857; background: #ecfdf5; border-color: rgb(167 243 208 / 0.8); }'
          if status_css in s and 'reference-list-status--neutral' not in s:
              s = s.replace(status_css, status_css + '\n.reference-list-status--neutral { color: #9ca3af; background: transparent; border-color: transparent; }', 1)
          p.write_text(s)

          # -----------------------------------------------------------------
          # Card view: same business restoration, while retaining reference DOM.
          # -----------------------------------------------------------------
          p = Path('weknora/frontend/src/views/knowledge/components/DocumentCardView.vue')
          s = p.read_text()
          s = s.replace('  canDownload: boolean\n', '', 1)
          s = s.replace("action: 'download' | 'edit'", "action: 'edit'", 1)
          s = s.replace("const cardSummary = (item: KnowledgeCard) => item.description || item.metadata?.summary || item.metadata?.content || '暂无内容摘录...'",
                        "const cardSummary = (item: KnowledgeCard) => item.description || item.metadata?.summary || item.metadata?.content || ''\nconst cardTypeLabel = (item: KnowledgeCard) => {\n  if (item.type === 'url') return t('knowledgeBase.typeURL') || 'URL'\n  if (item.type === 'manual') return t('knowledgeBase.typeManual')\n  if (item.file_type) return String(item.file_type).replace(/^\\./, '').toUpperCase()\n  return '--'\n}\nconst inFlightStatusText = (item: KnowledgeCard) => {\n  if (item.parse_status === 'finalizing') {\n    if (item.summary_status === 'pending' || item.summary_status === 'processing') return t('knowledgeBase.generatingSummary')\n    return t('knowledgeBase.statusFinalizing')\n  }\n  return t('knowledgeBase.parsingInProgress')\n}", 1)

          run_start = s.index('const runAction = (')
          run_end = s.index('\n\nconst openFolderPicker', run_start)
          run = '''const runAction = (action: 'edit' | 'view-trace' | 'reparse' | 'cancel-parse' | 'move' | 'batch-manage' | 'delete', item: KnowledgeCard) => {
            const fileName = item.file_name || cardTitle(item)
            if (action === 'delete' && !window.confirm(t('knowledgeBase.confirmDeleteDocument', { fileName }))) return
            if (action === 'cancel-parse' && !window.confirm(t('knowledgeBase.cancelParseConfirmBody', { title: fileName }))) return
            if (action === 'reparse' && !isParseInFlight(item.parse_status) && !window.confirm(t('knowledgeBase.rebuildConfirm', { fileName }))) return
            if (action === 'move') {
              emit('action', 'move', item)
              return
            }
            emit('action', action, item)
            closeMenu(item)
          }'''
          s = s[:run_start] + run + s[run_end:]
          s = s.replace('v-if="canEdit || canDownload" class="reference-document-card__menu-anchor"', 'v-if="canEdit" class="reference-document-card__menu-anchor"', 1)
          s, n = re.subn(
              r'''\n\s*<button\n\s*v-if="canDownload && \(item\.type === 'file' \|\| item\.type === 'manual'\)".*?</button>''',
              '', s, count=1, flags=re.S,
          )
          if n != 1:
              raise SystemExit('card download menu item not found')
          trace_anchor = '''                <button
                  v-if="canEdit && isTraceVisible(item)"'''
          s = replace_once(
              s,
              trace_anchor,
              '''                <button
                  v-if="item.type === 'manual'"
                  type="button"
                  class="reference-menu-item"
                  @click="runAction('edit', item)"
                >
                  <ReferenceIcon name="edit-2" :size="14" class="reference-menu-icon" />
                  <span>{{ t('knowledgeBase.editDocument') }}</span>
                </button>
''' + trace_anchor,
              'card manual edit',
          )
          s = s.replace('<span>查看 Trace</span>', "<span>{{ t('knowledgeStages.viewTrace') }}</span>", 1)
          s = s.replace('<span>停止解析</span>', "<span>{{ t('knowledgeBase.cancelParse') }}</span>", 1)
          s = s.replace('<span>移动到...</span>', "<span>{{ t('knowledgeBase.moveDocument') }}</span>", 1)
          s = s.replace('<div v-if="moveTargetsLoading" class="reference-menu-state">加载中...</div>', "<div v-if=\"moveTargetsLoading\" class=\"reference-menu-state\">{{ t('common.loading') }}</div>", 1)

          old_status = '''        <p class="reference-document-card__summary">{{ cardSummary(item) }}</p>

        <div v-if="isParseInFlight(item.parse_status)" class="reference-status-badge reference-status-badge--working">
          <ReferenceIcon name="loader-circle" :size="10" class="reference-spin" />
          <span>{{ item.parse_status === 'finalizing' ? '优化中 📈' : '解析中' }}</span>
        </div>
        <div v-else-if="item.parse_status === 'failed'" class="reference-status-badge reference-status-badge--failed">
          <span>解析失败</span>
        </div>'''
          new_status = '''        <p v-if="item.parse_status === 'completed' && !['pending', 'processing'].includes(String(item.summary_status || '')) && cardSummary(item)" class="reference-document-card__summary">{{ cardSummary(item) }}</p>

        <button v-if="isParseInFlight(item.parse_status)" type="button" class="reference-status-badge reference-status-badge--working reference-status-action" @click.stop="runAction('view-trace', item)">
          <ReferenceIcon name="loader-circle" :size="10" class="reference-spin" />
          <span>{{ inFlightStatusText(item) }}</span>
        </button>
        <button v-else-if="item.parse_status === 'failed'" type="button" class="reference-status-badge reference-status-badge--failed reference-status-action" @click.stop="runAction('view-trace', item)">
          <span>{{ t('knowledgeBase.parsingFailed') }}</span>
        </button>
        <div v-else-if="item.parse_status === 'draft'" class="reference-status-badge reference-status-badge--draft">
          <span>{{ t('knowledgeBase.draft') }}</span>
        </div>
        <div v-else-if="item.parse_status === 'completed' && ['pending', 'processing'].includes(String(item.summary_status || ''))" class="reference-status-badge reference-status-badge--working">
          <ReferenceIcon name="loader-circle" :size="10" class="reference-spin" />
          <span>{{ t('knowledgeBase.generatingSummary') }}</span>
        </div>'''
          s = replace_once(s, old_status, new_status, 'card status lifecycle')
          s = s.replace('<span class="reference-document-card__extension">{{ getExtension(item) }}</span>', '<span class="reference-document-card__extension">{{ cardTypeLabel(item) }}</span>', 1)
          css_anchor = '.reference-status-badge--failed { color: #dc2626; background: #fef2f2; border: 1px solid #fecaca; }'
          if css_anchor in s and 'reference-status-badge--draft' not in s:
              s = s.replace(css_anchor, '.reference-status-action { border: 0; cursor: pointer; text-align: left; font-family: inherit; }\n.reference-status-action:hover { filter: brightness(.96); }\n.reference-status-badge--draft { color: #b45309; background: #fffbeb; border: 1px solid rgb(253 230 138 / .8); }\n' + css_anchor, 1)
          p.write_text(s)

          # Static invariants before committing.
          merged = Path('weknora/frontend/src/views/knowledge/KnowledgeBase.vue').read_text() + p.read_text() + Path('weknora/frontend/src/views/knowledge/components/DocumentListView.vue').read_text()
          for forbidden in ['canDownload:', "action: 'download'", "runAction('download'", 'downloadKnowledge = async', 'resolveKnowledgeDownloadFileName']:
              if forbidden in merged:
                  raise SystemExit(f'stale accidental download behavior: {forbidden}')
          for required in [
              "item.type === 'manual'",
              "knowledgeBase.cancelParseConfirmBody",
              "knowledgeBase.rebuildConfirm",
              "knowledgeBase.channelFeishuDrive",
              "knowledgeBase.statusFinalizing",
              "tone: 'neutral'",
          ]:
              if required not in merged:
                  raise SystemExit(f'missing restored behavior: {required}')
          PY

          rm -f weknora/frontend/src/views/knowledge/knowledgeDownloadFileName.ts

      - name: Commit parity repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair required"
            exit 0
          fi
          git config user.name "musuw-business-parity"
          git config user.email "actions@users.noreply.github.com"
          git add -A weknora/frontend/src/views/knowledge
          git commit -m "fix: restore pre-visual document business behavior"
          git push origin HEAD:main
