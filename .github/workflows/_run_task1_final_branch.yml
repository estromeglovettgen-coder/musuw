name: Run Task1 final parity branch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_run_task1_final_branch.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task1-source-parity-final
          fetch-depth: 0
      - name: Apply deterministic reference/business transplant
        run: python3 scripts/task1_final_reference_business.py
      - name: Validate frontend
        working-directory: weknora/frontend
        run: |
          npm ci
          npm test
          npm run type-check
          npm run check-i18n
          npm run build
      - name: Commit only to audit branch
        run: |
          git config user.name "musuw-final-parity"
          git config user.email "actions@users.noreply.github.com"
          git add -A weknora/frontend/src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(ui): restore reference UI over upstream business"
          git push origin HEAD:task1-source-parity-final
