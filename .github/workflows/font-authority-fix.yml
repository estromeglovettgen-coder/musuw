name: One-shot reference font authority repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/font-authority-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Stop forcing every textarea to sans
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('weknora/frontend/src/assets/musuw-reference-authority.css')
          s = p.read_text()
          old = '#app textarea,\n'
          if old not in s:
            raise SystemExit('textarea authority selector not found')
          s = s.replace(old, '', 1)
          if '#app textarea,' in s:
            raise SystemExit('stale global textarea override remains')
          p.write_text(s)
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "musuw-visual-parity"
          git config user.email "actions@users.noreply.github.com"
          git add weknora/frontend/src/assets/musuw-reference-authority.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: allow reference mono textarea typography"
          git push origin HEAD:main
