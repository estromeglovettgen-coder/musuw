name: Deploy app edge staging

on:
  pull_request:
    paths:
      - 'app-edge/**'
      - 'auth/**'
      - 'weknora/frontend/**'
      - '.github/workflows/deploy-app-edge-staging.yml'
  workflow_dispatch:
    inputs:
      immutable_ref:
        description: Full commit SHA to build (must be on main)
        required: true
        type: string
      deploy:
        description: Publish only the staging workers.dev environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: app-edge-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and dry-run app edge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.immutable_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app-edge/package-lock.json
            auth/package-lock.json
            weknora/frontend/package-lock.json
      - name: Build the workspace frontend
        run: |
          npm ci --prefix weknora/frontend --ignore-scripts
          npm --prefix weknora/frontend run build-with-types
      - name: Build the auth shell with public CI placeholders
        env:
          VITE_AUTH_PUBLIC_ORIGIN: https://staging-app.musuw.com
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
          VITE_WEKNORA_OAUTH_CLIENT_ID: ci-native-client
        run: |
          npm ci --prefix auth --ignore-scripts
          npm --prefix auth run build
      - name: Install and verify the Worker
        run: |
          npm ci --prefix app-edge --ignore-scripts
          npm --prefix app-edge run assets:stage
          npm --prefix app-edge run config:check
          npm --prefix app-edge run workflow:check
          npm --prefix app-edge test
          npm --prefix app-edge run typecheck
          npm --prefix app-edge exec -- wrangler deploy --env staging --dry-run

  deploy:
    name: Publish staging workers.dev only
    # A fork PR can run `verify`, but can never enter this secret-bearing job.
    # Keep the repository guard in addition to the workflow_dispatch gate.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.repository == 'estromeglovettgen-coder/musuw' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: app-edge-staging
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.immutable_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert the checkout is a full immutable SHA on main with successful CI
        env:
          REQUESTED_REF: ${{ inputs.immutable_ref }}
          # The workflow has contents: read; use that read-only token only for
          # this canonical-repository dispatch fetch and never persist it.
          GH_READ_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_REF" =~ ^[0-9a-fA-F]{40}$ || "$REQUESTED_REF" =~ ^[0-9a-fA-F]{64}$ ]]
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$(git rev-parse "$REQUESTED_REF^{commit}")"
          git -c http.extraheader="AUTHORIZATION: bearer $GH_READ_TOKEN" fetch --no-tags origin main
          git merge-base --is-ancestor "$actual" origin/main
          runs="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GH_REPOSITORY/actions/runs?head_sha=$actual&per_page=100")"
          jq -e --arg sha "$actual" '
            [.workflow_runs[]? | select(.name == "CI" and .head_sha == $sha and .conclusion == "success")] | length > 0
          ' <<<"$runs" >/dev/null
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app-edge/package-lock.json
            auth/package-lock.json
            weknora/frontend/package-lock.json
      - name: Rebuild the tested static bundle
        run: |
          set -euo pipefail
          npm ci --prefix weknora/frontend --ignore-scripts
          npm --prefix weknora/frontend run build-with-types

      - name: Rebuild auth with the canonical public environment
        env:
          MUSUW_AUTH_STAGING_PUBLIC_ENV: ${{ secrets.MUSUW_AUTH_STAGING_PUBLIC_ENV }}
        run: |
          set -euo pipefail
          auth_env="$RUNNER_TEMP/musuw-auth-public.env"
          cleanup() { rm -f "$auth_env"; }
          trap cleanup EXIT
          umask 077
          printf '%s' "$MUSUW_AUTH_STAGING_PUBLIC_ENV" > "$auth_env"
          chmod 600 "$auth_env"
          test -s "$auth_env"
          awk '
            BEGIN {
              expected["VITE_AUTH_PUBLIC_ORIGIN"] = 1
              expected["VITE_SUPABASE_URL"] = 1
              expected["VITE_SUPABASE_PUBLISHABLE_KEY"] = 1
              expected["VITE_WEKNORA_OAUTH_CLIENT_ID"] = 1
              lines = 0
              bad = 0
            }
            {
              if ($0 ~ /^[[:space:]]*$/) next
              lines++
              separator = index($0, "=")
              if (separator == 0 || $0 ~ /\r/) {
                bad = 1
                next
              }
              key = substr($0, 1, separator - 1)
              value = substr($0, separator + 1)
              if (!(key in expected) || value == "") bad = 1
              count[key]++
            }
            END {
              for (key in expected) if (count[key] != 1) bad = 1
              if (lines != 4) bad = 1
              exit bad
            }
          ' "$auth_env"
          auth_public_origin="$(awk -F= '/^VITE_AUTH_PUBLIC_ORIGIN=/{print substr($0, index($0, "=") + 1); exit}' "$auth_env")"
          test "$auth_public_origin" = "https://staging-app.musuw.com"
          unset auth_public_origin
          while IFS='=' read -r key value; do
            [[ -z "$key" ]] && continue
            export "$key=$value"
          done < "$auth_env"
          npm ci --prefix auth --ignore-scripts
          npm --prefix auth run build
          npm ci --prefix app-edge --ignore-scripts
          npm --prefix app-edge run assets:stage
          npm --prefix app-edge run bundle:check
      - name: Deploy staging environment only
        working-directory: app-edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec -- wrangler deploy --env staging --strict --message "musuw app staging ${{ inputs.immutable_ref }}"
