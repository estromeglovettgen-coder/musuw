name: One-shot document list business parity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/document-list-parity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair list semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('weknora/frontend/src/views/knowledge/components/DocumentListView.vue')
          s = p.read_text()

          s = s.replace('  canDownload: boolean\n', '', 1)
          s = s.replace("action: 'download' | 'edit'", "action: 'edit'", 1)

          a = s.find('const sourceInfo =')
          b = s.find('\n\nconst openMenu =', a)
          if a < 0 or b < 0: raise SystemExit('source/status block missing')
          s = s[:a] + '''const sourceInfo = (item: KnowledgeItem): { icon: 'globe' | 'pen-line' | 'upload'; label: string } => {
  const ch = item.channel
  if (ch === 'feishu') return { icon: 'upload', label: t('knowledgeBase.channelFeishu') }
  if (ch === 'feishu_drive') return { icon: 'upload', label: t('knowledgeBase.channelFeishuDrive') }
  if (ch === 'lark_drive') return { icon: 'upload', label: t('knowledgeBase.channelLarkDrive') }
  if (ch === 'notion') return { icon: 'upload', label: t('knowledgeBase.channelNotion') }
  if (ch === 'yuque') return { icon: 'upload', label: t('knowledgeBase.channelYuque') }
  if (ch === 'wechat') return { icon: 'upload', label: t('knowledgeBase.channelWechat') }
  if (ch === 'wecom') return { icon: 'upload', label: t('knowledgeBase.channelWecom') }
  if (ch === 'dingtalk') return { icon: 'upload', label: t('knowledgeBase.channelDingtalk') }
  if (ch === 'slack') return { icon: 'upload', label: t('knowledgeBase.channelSlack') }
  if (ch === 'im') return { icon: 'upload', label: t('knowledgeBase.channelIm') }
  if (item.type === 'url') return { icon: 'globe', label: t('knowledgeBase.channelUrl') }
  if (item.type === 'manual') return { icon: 'pen-line', label: t('knowledgeBase.channelManual') }
  return { icon: 'upload', label: t('knowledgeBase.channelUpload') }
}
const statusInfo = (item: KnowledgeItem) => {
  if (item.parse_status === 'pending' || item.parse_status === 'processing') return { tone: 'indexing', label: t('knowledgeBase.statusProcessing'), spinning: true }
  if (item.parse_status === 'finalizing') {
    if (item.summary_status === 'pending' || item.summary_status === 'processing') return { tone: 'indexing', label: t('knowledgeBase.generatingSummary'), spinning: true }
    return { tone: 'indexing', label: t('knowledgeBase.statusFinalizing'), spinning: true }
  }
  if (item.parse_status === 'failed') return { tone: 'failed', label: t('knowledgeBase.statusFailed'), spinning: false }
  if (item.parse_status === 'cancelled') return { tone: 'optimizing', label: t('knowledgeBase.statusCancelled'), spinning: false }
  if (item.parse_status === 'draft') return { tone: 'optimizing', label: t('knowledgeBase.statusDraft'), spinning: false }
  if (item.parse_status === 'completed' && (item.summary_status === 'pending' || item.summary_status === 'processing')) return { tone: 'indexing', label: t('knowledgeBase.generatingSummary'), spinning: true }
  if (item.parse_status === 'completed') return { tone: 'completed', label: t('knowledgeBase.statusCompleted'), spinning: false }
  return { tone: 'neutral', label: '--', spinning: false }
}''' + s[b:]

          a = s.find('const runAction = (')
          b = s.find('\nconst pickFolder =', a)
          if a < 0 or b < 0: raise SystemExit('runAction block missing')
          s = s[:a] + '''const runAction = (action: 'edit' | 'reparse' | 'cancel-parse' | 'move' | 'delete' | 'view-trace' | 'batch-manage', item: KnowledgeItem) => {
  if (action === 'delete' && !window.confirm(t('knowledgeBase.confirmDeleteDocument', { fileName: item.file_name }))) return
  if (action === 'cancel-parse' && !window.confirm(t('knowledgeBase.cancelParseConfirmBody', { title: item.file_name }))) return
  if (action === 'reparse' && !isParseInFlight(item.parse_status) && !window.confirm(t('knowledgeBase.rebuildConfirm', { fileName: item.file_name }))) return
  if (action === 'move') {
    emit('action', action, item)
    return
  }
  emit('action', action, item)
  closeMenu()
}''' + s[b:]

          s = s.replace('v-if="canEdit || canDownload"', 'v-if="canEdit"', 1)
          s = s.replace('<template v-if="(canEdit || canDownload) && activeMenuItemId === item.id">', '<template v-if="canEdit && activeMenuItemId === item.id">', 1)
          s, n = re.subn(r'''\n\s*<button\n\s*v-if="canDownload && \(item\.type === 'file' \|\| item\.type === 'manual'\)".*?</button>''', '', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('download button missing')

          trace = '''                    <button v-if="canEdit && isTraceVisible(item)" type="button" class="reference-list-menu-item" @click="runAction('view-trace', item)">'''
          if trace not in s: raise SystemExit('trace anchor missing')
          s = s.replace(trace, '''                    <button v-if="item.type === 'manual'" type="button" class="reference-list-menu-item" @click="runAction('edit', item)">
                      <ReferenceIcon name="edit-2" :size="14" class="reference-list-menu-icon" />
                      <span>{{ t('knowledgeBase.editDocument') }}</span>
                    </button>
''' + trace, 1)

          simple = {
            'aria-label="全选"': ':aria-label="t(\'knowledgeBase.selectAll\')"',
            '<th>文件名</th>': "<th>{{ t('knowledgeBase.columnName') }}</th>",
            '<th class="reference-col-tags">标签</th>': "<th class=\"reference-col-tags\">{{ t('knowledgeBase.columnTag') }}</th>",
            '<th class="reference-col-source">来源</th>': "<th class=\"reference-col-source\">{{ t('knowledgeBase.columnSource') }}</th>",
            '<th class="reference-col-size">大小</th>': "<th class=\"reference-col-size\">{{ t('knowledgeBase.columnSize') }}</th>",
            '<th class="reference-col-status">状态</th>': "<th class=\"reference-col-status\">{{ t('knowledgeBase.columnStatus') }}</th>",
            '<th class="reference-col-time">更新时间</th>': "<th class=\"reference-col-time\">{{ t('knowledgeBase.columnUpdatedAt') }}</th>",
            '<th class="reference-col-action">操作</th>': "<th class=\"reference-col-action\">{{ t('knowledgeBase.columnActions') }}</th>",
            "<p>{{ item.description || '无提取文本' }}</p>": '<p v-if="item.description">{{ item.description }}</p>',
            '>+ 标签</button>': ">+ {{ t('knowledgeBase.tagLabel') }}</button>",
            '<span>查看 Trace</span>': "<span>{{ t('knowledgeStages.viewTrace') }}</span>",
            '<span>停止解析</span>': "<span>{{ t('knowledgeBase.cancelParse') }}</span>",
            '<span>移动到...</span>': "<span>{{ t('knowledgeBase.moveDocument') }}</span>",
            '<div v-if="moveTargetsLoading" class="reference-list-menu-state">加载中...</div>': "<div v-if=\"moveTargetsLoading\" class=\"reference-list-menu-state\">{{ t('common.loading') }}</div>",
          }
          for old, new in simple.items():
            if old not in s: raise SystemExit(f'missing simple anchor: {old}')
            s = s.replace(old, new, 1)

          if 'reference-list-status--neutral' not in s:
            old = '.reference-list-status--completed { color: #047857; background: #ecfdf5; border-color: rgb(167 243 208 / 0.8); }'
            if old not in s: raise SystemExit('status css anchor missing')
            s = s.replace(old, old + '\n.reference-list-status--neutral { color: #9ca3af; background: transparent; border-color: transparent; }', 1)

          for bad in ['canDownload:', "action: 'download'", "runAction('download'"]:
            if bad in s: raise SystemExit(f'stale list behavior: {bad}')
          for good in ['knowledgeBase.channelFeishuDrive', "tone: 'neutral'", "runAction('edit'", 'knowledgeBase.cancelParseConfirmBody', 'knowledgeBase.rebuildConfirm']:
            if good not in s: raise SystemExit(f'missing list behavior: {good}')
          p.write_text(s)
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "musuw-business-parity"
          git config user.email "actions@users.noreply.github.com"
          git add weknora/frontend/src/views/knowledge/components/DocumentListView.vue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: restore document list business semantics"
          git push origin HEAD:main
