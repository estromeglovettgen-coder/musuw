name: Deploy production application

on:
  workflow_dispatch:
    inputs:
      immutable_ref:
        description: Full commit SHA or v* tag to release; must be on origin/main and have successful CI
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release
  # A release must finish or fail and roll back through the server seam before
  # another release can start. Never cancel an in-flight production update.
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild the approved revision
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      release_ref: ${{ steps.resolve.outputs.release_ref }}
    env:
      VITE_AUTH_PUBLIC_ORIGIN: https://app.musuw.com
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      VITE_WEKNORA_OAUTH_CLIENT_ID: ci-native-client
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.immutable_ref || github.ref_name || github.sha }}
          fetch-depth: 0
          # The read-only checkout token is needed for the origin/main ancestry
          # proof; the runner is ephemeral and no write permission is granted.
          persist-credentials: true
      - name: Resolve and authorize the immutable release revision
        id: resolve
        env:
          REQUESTED_REF: ${{ inputs.immutable_ref || github.ref_name || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_REF:?immutable release ref is required}"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$EVENT_REF" = refs/heads/main
          else
            case "$EVENT_REF" in
              refs/tags/v*) test "$EVENT_TAG" = "$requested" ;;
              *) printf '%s\n' 'production release accepts only workflow_dispatch on main or v* tag pushes' >&2; exit 1 ;;
            esac
          fi
          if [[ "$requested" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            [[ "$requested" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$(git cat-file -t "refs/tags/$requested")" = tag
            selected_sha="$(git rev-parse "$requested^{commit}")"
            selected_ref="$requested"
          elif [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]]; then
            selected_sha="$(git rev-parse "$requested^{commit}")"
            selected_ref="$requested"
          else
            printf '%s\n' 'immutable_ref must be a full SHA or v* tag' >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$selected_sha"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$actual" refs/remotes/origin/main
          runs="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$actual&per_page=100")"
          jq -e --arg sha "$actual" '
            [.workflow_runs[]? | select(.name == "CI" and .head_sha == $sha and .conclusion == "success")] | length > 0
          ' <<<"$runs" >/dev/null
          {
            printf 'release_sha=%s\n' "$actual"
            printf 'release_ref=%s\n' "$selected_ref"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            weknora/frontend/package-lock.json
            storefront/package-lock.json
            package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix weknora/frontend --ignore-scripts
      - name: Rebuild and type-check frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm --prefix weknora/frontend run build-with-types
      - name: Install auth shell dependencies
        run: npm ci --prefix auth --ignore-scripts
      - name: Rebuild auth shell
        run: npm --prefix auth run build
      - name: Install storefront dependencies
        run: npm ci --prefix storefront --ignore-scripts
      - name: Rebuild and test storefront
        run: npm --prefix storefront test
      - name: Verify production static and release seams
        run: |
          bash scripts/weknora-production/verify-static.sh
          bash scripts/weknora-production/deploy-ci-seams-contract.test.sh
          bash scripts/weknora-production/source-manifest-integrity.test.sh
          bash scripts/weknora-production/release-transaction-contract.test.sh
          # verify-static.sh renders both base and edge scripts/weknora-production/compose.sh config.
      - name: Run the release lifecycle simulation
        run: |
          bash scripts/weknora-workflow-simulation.test.sh
          bash scripts/weknora-production/release-transaction-simulation.test.sh
          bash scripts/weknora-production/release-transaction-actual.test.sh

  deploy:
    name: Execute the approved production release
    needs: rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.rebuild.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert the detached checkout matches the approved SHA
        env:
          RELEASE_SHA: ${{ needs.rebuild.outputs.release_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$RELEASE_SHA"
      - name: Set up Node for the existing release seam
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            weknora/frontend/package-lock.json
            auth/package-lock.json
      - name: Install auth shell dependencies for build-static
        run: npm ci --prefix auth --ignore-scripts
      - name: Set up temporary, pinned deployment inputs
        id: prepare
        env:
          DEPLOY_SSH_KEY: ${{ secrets.MUSUW_PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.MUSUW_PRODUCTION_SSH_KNOWN_HOSTS }}
          PRODUCTION_SSH_REMOTE: ${{ secrets.MUSUW_PRODUCTION_SSH_REMOTE }}
          PRODUCTION_PUBLIC_ENV: ${{ secrets.MUSUW_PRODUCTION_PUBLIC_ENV }}
          AUTH_PUBLIC_ENV: ${{ secrets.MUSUW_AUTH_PUBLIC_ENV }}
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/musuw-production-runtime"
          key_path="$RUNNER_TEMP/musuw-production-ssh-key"
          known_hosts_path="$RUNNER_TEMP/musuw-production-known-hosts"
          install -d -m 700 "$runtime_dir"
          {
            printf 'runtime_dir=%s\n' "$runtime_dir"
            printf 'key_path=%s\n' "$key_path"
            printf 'known_hosts_path=%s\n' "$known_hosts_path"
          } >> "$GITHUB_OUTPUT"
          umask 077
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$PRODUCTION_SSH_REMOTE"
          test -n "$PRODUCTION_PUBLIC_ENV"
          test -n "$AUTH_PUBLIC_ENV"
          case "$PRODUCTION_SSH_REMOTE" in
            musuw-deploy@*) ;;
            *) printf '%s\n' 'production SSH remote must use the restricted musuw-deploy account' >&2; exit 1 ;;
          esac
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_path"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_path"
          printf '%s\n' "$PRODUCTION_PUBLIC_ENV" > "$runtime_dir/production.public.env"
          printf '%s\n' "$AUTH_PUBLIC_ENV" > "$runtime_dir/auth-public.env"
          test -s "$key_path"
          test -s "$known_hosts_path"
          test -s "$runtime_dir/production.public.env"
          test -s "$runtime_dir/auth-public.env"
      - name: Assert the formal staged release rollback seam
        run: |
          set -euo pipefail
          grep -Fq 'release-ci.sh' scripts/weknora-deploy.sh
          grep -Fq 'remote_gate preflight update' scripts/weknora-deploy.sh
          grep -Fq 'remote_gate promote update' scripts/weknora-deploy.sh
          grep -Fq 'remote_gate run update' scripts/weknora-deploy.sh
          test -x scripts/weknora-production/server/musuw-deploy-ssh-gate
          test -x scripts/weknora-production/server/musuw-deploy-gate
          grep -Fq 'rollback.sh' scripts/weknora-production/release-ci.sh
          grep -Fq 'release-transaction.sh' scripts/weknora-production/release-ci.sh
          grep -Fq 'public_probes' scripts/weknora-production/release-transaction.sh
      - name: Execute the existing WeKnora release seam
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          WEKNORA_DEPLOY_RUNTIME_DIR: ${{ steps.prepare.outputs.runtime_dir }}
          WEKNORA_DEPLOY_KNOWN_HOSTS_FILE: ${{ steps.prepare.outputs.known_hosts_path }}
          WEKNORA_DEPLOY_SSH_KEY: ${{ steps.prepare.outputs.key_path }}
          WEKNORA_DEPLOY_REMOTE: ${{ secrets.MUSUW_PRODUCTION_SSH_REMOTE }}
          WEKNORA_DEPLOY_SSH_PORT: ${{ secrets.MUSUW_PRODUCTION_SSH_PORT }}
          WEKNORA_DEPLOY_REVISION: ${{ needs.rebuild.outputs.release_sha }}
          WEKNORA_DEPLOY_RELEASE_ID: musuw-${{ needs.rebuild.outputs.release_sha }}
        run: |
          set -euo pipefail
          bash scripts/weknora-deploy.sh update 2>&1 | tee "$RUNNER_TEMP/musuw-production-release.log"
      - name: Confirm the transaction owns the rollbackable public probes
        id: public_health
        run: |
          set -euo pipefail
          # The server transaction probes the public revision before commit.
          # The runner must not add a post-commit probe without rollback scope.
          grep -Fq 'https://app.musuw.com/readyz' scripts/weknora-production/release-transaction.sh
          grep -Fq 'public_probes' scripts/weknora-production/release-transaction.sh
          grep -Fq 'rollback_transaction' scripts/weknora-production/release-transaction.sh
          if awk '/"\$transaction_script"/{seen=1; next} seen && /curl /{found=1} END{exit(found ? 0 : 1)}' scripts/weknora-production/release-ci.sh; then
            printf '%s\n' 'release-ci contains an unrollbackable post-transaction curl' >&2
            exit 1
          fi
      - name: Write production release manifest and checksum
        if: always()
        env:
          RELEASE_SHA: ${{ needs.rebuild.outputs.release_sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
          RELEASE_PROBE_OUTCOME: ${{ steps.public_health.outcome }}
        run: |
          set -euo pipefail
          source_manifest='third_party/weknora/active-upstream-source.json'
          source_checksum=''
          if [ -f "$source_manifest" ]; then
            source_checksum="$(sha256sum "$source_manifest" | awk '{print $1}')"
          fi
          expected_release_id="musuw-$RELEASE_SHA"
          server_release_id=''
          if [ -f "$RUNNER_TEMP/musuw-production-release.log" ]; then
            server_release_id="$(grep -Eo 'production (update|update-ui) green: [^ ]+' "$RUNNER_TEMP/musuw-production-release.log" | tail -n 1 | sed -E 's/.*green: ([^ ]+).*/\1/' || true)"
          fi
          if [ -z "$server_release_id" ] && [ -f "$RUNNER_TEMP/musuw-production-release.log" ] && grep -Fq 'CI staged release green:' "$RUNNER_TEMP/musuw-production-release.log"; then
            server_release_id="$expected_release_id"
          fi
          server_source_bundle_sha256=''
          if [ -f "$RUNNER_TEMP/musuw-production-release.log" ]; then
            server_source_bundle_sha256="$(grep -Eo 'source_bundle_sha256=[0-9a-fA-F]{64}' "$RUNNER_TEMP/musuw-production-release.log" | tail -n 1 | cut -d= -f2 || true)"
          fi
          if [ "$RELEASE_PROBE_OUTCOME" = success ]; then
            test "$server_release_id" = "$expected_release_id"
            [[ "$server_source_bundle_sha256" =~ ^[0-9a-fA-F]{64}$ ]]
          fi
          jq -n \
            --arg schema_version 'musuw.release.v1' \
            --arg commit_sha "$RELEASE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_run "$WORKFLOW_RUN" \
            --arg workflow_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_manifest "$source_manifest" \
            --arg source_manifest_sha256 "$source_checksum" \
            --arg server_release_id "$server_release_id" \
            --arg server_source_bundle_sha256 "$server_source_bundle_sha256" \
            '{schema_version:$schema_version,commit_sha:$commit_sha,repository:$repository,workflow:"Deploy production",workflow_run:$workflow_run,workflow_attempt:$workflow_attempt,source_manifest:$source_manifest,source_manifest_sha256:$source_manifest_sha256,server_release_id:(if $server_release_id == "" then null else $server_release_id end),server_source_bundle_sha256:(if $server_source_bundle_sha256 == "" then null else $server_source_bundle_sha256 end)}' \
            > "$RUNNER_TEMP/musuw-production-release-manifest.json"
          sha256sum "$RUNNER_TEMP/musuw-production-release-manifest.json" > "$RUNNER_TEMP/musuw-production-release-manifest.json.sha256"
      - name: Upload production release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ needs.rebuild.outputs.release_sha }}
          path: |
            ${{ runner.temp }}/musuw-production-release.log
            ${{ runner.temp }}/musuw-production-release-manifest.json
            ${{ runner.temp }}/musuw-production-release-manifest.json.sha256
            ${{ runner.temp }}/musuw-production-rollback-evidence.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Remove temporary deployment inputs
        if: always()
        env:
          RUNTIME_DIR: ${{ steps.prepare.outputs.runtime_dir }}
          KEY_PATH: ${{ steps.prepare.outputs.key_path }}
          KNOWN_HOSTS_PATH: ${{ steps.prepare.outputs.known_hosts_path }}
        run: |
          set -euo pipefail
          if [ -n "${KEY_PATH:-}" ]; then rm -f -- "$KEY_PATH"; fi
          if [ -n "${KNOWN_HOSTS_PATH:-}" ]; then rm -f -- "$KNOWN_HOSTS_PATH"; fi
          if [ -n "${RUNTIME_DIR:-}" ]; then
            rm -f -- "$RUNTIME_DIR/production.public.env" "$RUNTIME_DIR/auth-public.env"
            rmdir -- "$RUNTIME_DIR" 2>/dev/null || true
          fi
