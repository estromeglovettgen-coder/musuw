name: One-shot composer event-contract repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/knowledge-component-parity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair native textarea event contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('weknora/frontend/src/components/Input-field.vue')
          s = p.read_text()

          old_clear = '''const clearvalue = () => {
            // Guard: only clear when the textarea DOM element is still mounted,
            // otherwise TDesign's autosize will call getComputedStyle on a non-Element.
            if (!getTextareaEl()) return;
            query.value = "";
          };'''
          new_clear = '''const clearvalue = () => {
            const textarea = getTextareaEl();
            if (!textarea) return;
            query.value = "";
            // Native textarea replacement must reset its own inline autosize state.
            nextTick(() => {
              const el = getTextareaEl();
              if (el) el.style.height = "auto";
            });
          };'''
          if old_clear not in s:
            # Tolerate formatter indentation differences by replacing the exact
            # semantic body instead of silently skipping the repair.
            start = s.find('const clearvalue = () => {')
            end = s.find('\n};', start)
            if start < 0 or end < 0:
              raise SystemExit('clearvalue block not found')
            end += len('\n};')
            s = s[:start] + new_clear + s[end:]
          else:
            s = s.replace(old_clear, new_clear, 1)

          start = s.find('const onKeydown = (')
          end = s.find('\n\nconst onPaste =', start)
          if start < 0 or end < 0:
            raise SystemExit('onKeydown block not found')
          new_keydown = '''const onKeydown = (
            valOrEvent: string | KeyboardEvent,
            context?: { e?: KeyboardEvent },
          ) => {
            // Preserve both the original TDesign callback contract and the
            // visual-reference native textarea DOM event contract.
            const keyEvent = valOrEvent instanceof KeyboardEvent ? valOrEvent : context?.e;
            const value = typeof valOrEvent === "string" ? valOrEvent : query.value;
            if (!keyEvent) return;

            // Do not treat the Enter used to commit a CJK IME composition as Send.
            if (isComposing.value || keyEvent.isComposing || keyEvent.keyCode === 229) return;

            if (showMention.value) {
              if (keyEvent.keyCode === 38) {
                keyEvent.preventDefault();
                mentionSelectorRef.value?.moveActive(-1);
                return;
              }
              if (keyEvent.keyCode === 40) {
                keyEvent.preventDefault();
                mentionSelectorRef.value?.moveActive(1);
                return;
              }
              if (keyEvent.keyCode === 13) {
                keyEvent.preventDefault();
                mentionSelectorRef.value?.confirmActive();
                return;
              }
              if (keyEvent.keyCode === 27) {
                if (mentionSelectorRef.value?.leaveGroup()) return;
                showMention.value = false;
                return;
              }
            }

            if (keyEvent.keyCode === 8) {
              const textarea = getTextareaEl();
              if (
                textarea &&
                textarea.selectionStart === 0 &&
                textarea.selectionEnd === 0 &&
                query.value === ""
              ) {
                const items = allSelectedItems.value;
                if (items.length > 0) {
                  keyEvent.preventDefault();
                  removeSelectedItem(items[items.length - 1]);
                  return;
                }
              }
            }

            if ((keyEvent.keyCode === 13 && keyEvent.shiftKey) || (keyEvent.keyCode === 13 && keyEvent.ctrlKey)) {
              return;
            }
            if (keyEvent.keyCode === 13) {
              keyEvent.preventDefault();
              createSession(value);
            }
          };'''
          s = s[:start] + new_keydown + s[end:]

          old_disabled = ':disabled="!query.trim() && uploadedImages.length === 0 && uploadedAttachments.length === 0"'
          if old_disabled not in s:
            raise SystemExit('send-button disabled anchor not found')
          s = s.replace(old_disabled, ':disabled="!query.length"', 1)

          for needle in [
            '<textarea',
            '@keydown="onKeydown"',
            'valOrEvent: string | KeyboardEvent',
            'keyEvent.isComposing',
            ':disabled="!query.length"',
          ]:
            if needle not in s:
              raise SystemExit(f'missing postcondition: {needle}')
          if 'event.e.keyCode' in s:
            raise SystemExit('stale TDesign-only keydown access remains')

          p.write_text(s)
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair required"
            exit 0
          fi
          git config user.name "musuw-parity-repair"
          git config user.email "actions@users.noreply.github.com"
          git add weknora/frontend/src/components/Input-field.vue
          git commit -m "fix: preserve chat composer keyboard semantics"
          git push origin HEAD:main
