name: One-shot knowledge component parity repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/knowledge-component-parity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore upstream document semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          # ---- List view ----
          p = Path('weknora/frontend/src/views/knowledge/components/DocumentListView.vue')
          s = p.read_text()

          old_source = '''const sourceInfo = (item: KnowledgeItem): { icon: 'globe' | 'pen-line' | 'upload'; label: string } => {
  if (item.type === 'url' || item.source === 'crawler') return { icon: 'globe', label: '抓取' }
  if (item.type === 'manual' || item.source === 'online') return { icon: 'pen-line', label: '在线' }
  if (item.channel === 'api' || item.source === 'api') return { icon: 'upload', label: 'API同步' }
  return { icon: 'upload', label: '上传' }
}
const statusInfo = (item: KnowledgeItem) => {
  if (item.parse_status === 'failed') return { tone: 'failed', label: '失败', spinning: false }
  if (item.parse_status === 'pending' || item.parse_status === 'processing') return { tone: 'indexing', label: '索引中', spinning: true }
  if (item.parse_status === 'finalizing' || (item.parse_status === 'completed' && ['pending', 'processing'].includes(String(item.summary_status || '')))) {
    return { tone: 'optimizing', label: '优化中', spinning: true }
  }
  if (item.parse_status === 'cancelled') return { tone: 'failed', label: '已停止', spinning: false }
  if (item.parse_status === 'draft') return { tone: 'optimizing', label: '草稿', spinning: false }
  return { tone: 'completed', label: '已完成', spinning: false }
}
'''
          new_source = '''const sourceInfo = (item: KnowledgeItem): { icon: 'globe' | 'pen-line' | 'upload'; label: string } => {
  const ch = item.channel
  const channelLabels: Record<string, string> = {
    web: 'knowledgeBase.channelWeb',
    api: 'knowledgeBase.channelApi',
    browser_extension: 'knowledgeBase.channelBrowserExtension',
    feishu: 'knowledgeBase.channelFeishu',
    feishu_drive: 'knowledgeBase.channelFeishuDrive',
    lark_drive: 'knowledgeBase.channelLarkDrive',
    notion: 'knowledgeBase.channelNotion',
    yuque: 'knowledgeBase.channelYuque',
    gitlab: 'knowledgeBase.channelGitLab',
    ima: 'knowledgeBase.channelIma',
    wechat: 'knowledgeBase.channelWechat',
    wecom: 'knowledgeBase.channelWecom',
    dingtalk: 'knowledgeBase.channelDingtalk',
    slack: 'knowledgeBase.channelSlack',
    im: 'knowledgeBase.channelIm',
  }
  if (ch && channelLabels[ch]) return { icon: ch === 'web' ? 'globe' : 'upload', label: t(channelLabels[ch]) }
  if (item.type === 'url') return { icon: 'globe', label: t('knowledgeBase.channelUrl') }
  if (item.type === 'manual') return { icon: 'pen-line', label: t('knowledgeBase.channelManual') }
  return { icon: 'upload', label: t('knowledgeBase.channelUpload') }
}
const statusInfo = (item: KnowledgeItem) => {
  if (item.parse_status === 'pending' || item.parse_status === 'processing') {
    return { tone: 'indexing', label: t('knowledgeBase.statusProcessing'), spinning: true }
  }
  if (item.parse_status === 'finalizing') {
    if (item.summary_status === 'pending' || item.summary_status === 'processing') {
      return { tone: 'indexing', label: t('knowledgeBase.generatingSummary'), spinning: true }
    }
    return { tone: 'indexing', label: t('knowledgeBase.statusFinalizing'), spinning: true }
  }
  if (item.parse_status === 'failed') return { tone: 'failed', label: t('knowledgeBase.statusFailed'), spinning: false }
  if (item.parse_status === 'cancelled') return { tone: 'optimizing', label: t('knowledgeBase.statusCancelled'), spinning: false }
  if (item.parse_status === 'draft') return { tone: 'optimizing', label: t('knowledgeBase.statusDraft'), spinning: false }
  if (item.parse_status === 'completed' && (item.summary_status === 'pending' || item.summary_status === 'processing')) {
    return { tone: 'indexing', label: t('knowledgeBase.generatingSummary'), spinning: true }
  }
  if (item.parse_status === 'completed') return { tone: 'completed', label: t('knowledgeBase.statusCompleted'), spinning: false }
  return { tone: 'neutral', label: '--', spinning: false }
}
'''
          s = once(s, old_source, new_source, 'list source/status semantics')

          old_run = '''const runAction = (action: 'download' | 'reparse' | 'cancel-parse' | 'move' | 'delete' | 'view-trace' | 'batch-manage', item: KnowledgeItem) => {
  if (action === 'delete' && !window.confirm(`确定删除文档 \\"${item.file_name}\\" 吗？`)) return
  if (action === 'move') {
    emit('action', action, item)
    return
  }
  emit('action', action, item)
  closeMenu()
}
'''
          new_run = '''const runAction = (action: 'download' | 'edit' | 'reparse' | 'cancel-parse' | 'move' | 'delete' | 'view-trace' | 'batch-manage', item: KnowledgeItem) => {
  if (action === 'delete' && !window.confirm(t('knowledgeBase.confirmDeleteDocument', { fileName: item.file_name }))) return
  if (action === 'cancel-parse' && !window.confirm(t('knowledgeBase.cancelParseConfirmBody', { title: item.file_name }))) return
  if (action === 'reparse' && !isParseInFlight(item.parse_status) && !window.confirm(t('knowledgeBase.rebuildConfirm', { fileName: item.file_name }))) return
  if (action === 'move') {
    emit('action', action, item)
    return
  }
  emit('action', action, item)
  closeMenu()
}
'''
          s = once(s, old_run, new_run, 'list action confirmations')

          s = once(s, '<th>文件名</th>', "<th>{{ t('knowledgeBase.columnName') }}</th>", 'list name header')
          s = once(s, '<th class="reference-col-tags">标签</th>', "<th class=\"reference-col-tags\">{{ t('knowledgeBase.columnTag') }}</th>", 'list tag header')
          s = once(s, '<th class="reference-col-source">来源</th>', "<th class=\"reference-col-source\">{{ t('knowledgeBase.columnSource') }}</th>", 'list source header')
          s = once(s, '<th class="reference-col-size">大小</th>', "<th class=\"reference-col-size\">{{ t('knowledgeBase.columnSize') }}</th>", 'list size header')
          s = once(s, '<th class="reference-col-status">状态</th>', "<th class=\"reference-col-status\">{{ t('knowledgeBase.columnStatus') }}</th>", 'list status header')
          s = once(s, '<th class="reference-col-time">更新时间</th>', "<th class=\"reference-col-time\">{{ t('knowledgeBase.columnUpdatedAt') }}</th>", 'list time header')
          s = once(s, '<th class="reference-col-action">操作</th>', "<th class=\"reference-col-action\">{{ t('knowledgeBase.columnActions') }}</th>", 'list action header')
          s = once(s, 'aria-label="全选"', ':aria-label="t(\'knowledgeBase.selectAll\')"', 'list select-all i18n')
          s = once(s, "<p>{{ item.description || '无提取文本' }}</p>", '<p v-if="item.description">{{ item.description }}</p>', 'list description fallback')
          s = once(s, '>+ 标签</button>', ">+ {{ t('knowledgeBase.tagLabel') }}</button>", 'list tag label i18n')

          # Match upstream: action column exists only for editable KBs. canDownload remains a nested action gate.
          s = s.replace('v-if="canEdit || canDownload"\n                  type="button"', 'v-if="canEdit"\n                  type="button"', 1)
          s = s.replace('<template v-if="(canEdit || canDownload) && activeMenuItemId === item.id">', '<template v-if="canEdit && activeMenuItemId === item.id">', 1)

          menu_anchor = '''                    <button v-if="canEdit && isTraceVisible(item)" type="button" class="reference-list-menu-item" @click="runAction('view-trace', item)">'''
          edit_block = '''                    <button v-if="item.type === 'manual'" type="button" class="reference-list-menu-item" @click="runAction('edit', item)">
                      <ReferenceIcon name="edit-2" :size="14" class="reference-list-menu-icon" />
                      <span>{{ t('knowledgeBase.editDocument') }}</span>
                    </button>
                    <button v-if="canEdit && isTraceVisible(item)" type="button" class="reference-list-menu-item" @click="runAction('view-trace', item)">'''
          s = once(s, menu_anchor, edit_block, 'list manual edit')
          s = s.replace('<span>查看 Trace</span>', "<span>{{ t('knowledgeStages.viewTrace') }}</span>", 1)
          s = s.replace('<span>停止解析</span>', "<span>{{ t('knowledgeBase.cancelParse') }}</span>", 1)
          s = s.replace('<span>移动到...</span>', "<span>{{ t('knowledgeBase.moveDocument') }}</span>", 1)
          s = once(s, '.reference-list-status--completed { color: #047857; background: #ecfdf5; border-color: rgb(167 243 208 / 0.8); }', '.reference-list-status--completed { color: #047857; background: #ecfdf5; border-color: rgb(167 243 208 / 0.8); }\n.reference-list-status--neutral { color: #9ca3af; background: transparent; border-color: transparent; }', 'list neutral status css')
          p.write_text(s)

          # ---- Card view ----
          p = Path('weknora/frontend/src/views/knowledge/components/DocumentCardView.vue')
          s = p.read_text()

          s = once(
              s,
              "const cardSummary = (item: KnowledgeCard) => item.description || item.metadata?.summary || item.metadata?.content || '暂无内容摘录...'",
              "const cardSummary = (item: KnowledgeCard) => item.description || item.metadata?.summary || item.metadata?.content || ''\nconst cardTypeLabel = (item: KnowledgeCard) => {\n  if (item.type === 'url') return t('knowledgeBase.typeURL') || 'URL'\n  if (item.type === 'manual') return t('knowledgeBase.typeManual')\n  if (item.file_type) return String(item.file_type).replace(/^\\./, '').toUpperCase()\n  return '--'\n}\nconst inFlightStatusText = (item: KnowledgeCard) => {\n  if (item.parse_status === 'finalizing') {\n    if (item.summary_status === 'pending' || item.summary_status === 'processing') return t('knowledgeBase.generatingSummary')\n    return t('knowledgeBase.statusFinalizing')\n  }\n  return t('knowledgeBase.parsingInProgress')\n}",
              'card summary/type/status helpers',
          )

          old_card_run = '''const runAction = (action: 'download' | 'view-trace' | 'reparse' | 'cancel-parse' | 'move' | 'batch-manage' | 'delete', item: KnowledgeCard) => {
  if (action === 'delete') {
    if (!window.confirm(`确定删除文档 \\"${cardTitle(item)}\\" 吗？`)) return
  }

  if (action === 'move') {
    emit('action', 'move', item)
    return
  }

  emit('action', action, item)
  closeMenu(item)
}
'''
          new_card_run = '''const runAction = (action: 'download' | 'edit' | 'view-trace' | 'reparse' | 'cancel-parse' | 'move' | 'batch-manage' | 'delete', item: KnowledgeCard) => {
  const fileName = item.file_name || cardTitle(item)
  if (action === 'delete' && !window.confirm(t('knowledgeBase.confirmDeleteDocument', { fileName }))) return
  if (action === 'cancel-parse' && !window.confirm(t('knowledgeBase.cancelParseConfirmBody', { title: fileName }))) return
  if (action === 'reparse' && !isParseInFlight(item.parse_status) && !window.confirm(t('knowledgeBase.rebuildConfirm', { fileName }))) return
  if (action === 'move') {
    emit('action', 'move', item)
    return
  }
  emit('action', action, item)
  closeMenu(item)
}
'''
          s = once(s, old_card_run, new_card_run, 'card action confirmations')

          # Match upstream menu visibility: editable KBs own the action popup; canDownload gates only the download row.
          s = once(s, '<div v-if="canEdit || canDownload" class="reference-document-card__menu-anchor">', '<div v-if="canEdit" class="reference-document-card__menu-anchor">', 'card menu edit gate')

          trace_anchor = '''                <button
                  v-if="canEdit && isTraceVisible(item)"'''
          edit_block = '''                <button
                  v-if="item.type === 'manual'"
                  type="button"
                  class="reference-menu-item"
                  @click="runAction('edit', item)"
                >
                  <ReferenceIcon name="edit-2" :size="14" class="reference-menu-icon" />
                  <span>{{ t('knowledgeBase.editDocument') }}</span>
                </button>
                <button
                  v-if="canEdit && isTraceVisible(item)"'''
          s = once(s, trace_anchor, edit_block, 'card manual edit')
          s = s.replace('<span>查看 Trace</span>', "<span>{{ t('knowledgeStages.viewTrace') }}</span>", 1)
          s = s.replace('<span>停止解析</span>', "<span>{{ t('knowledgeBase.cancelParse') }}</span>", 1)
          s = s.replace('<span>移动到...</span>', "<span>{{ t('knowledgeBase.moveDocument') }}</span>", 1)
          s = s.replace("<div v-if=\"moveTargetsLoading\" class=\"reference-menu-state\">加载中...</div>", "<div v-if=\"moveTargetsLoading\" class=\"reference-menu-state\">{{ t('common.loading') }}</div>", 1)

          old_summary = '''        <p class="reference-document-card__summary">{{ cardSummary(item) }}</p>

        <div v-if="isParseInFlight(item.parse_status)" class="reference-status-badge reference-status-badge--working">
          <ReferenceIcon name="loader-circle" :size="10" class="reference-spin" />
          <span>{{ item.parse_status === 'finalizing' ? '优化中 📈' : '解析中' }}</span>
        </div>
        <div v-else-if="item.parse_status === 'failed'" class="reference-status-badge reference-status-badge--failed">
          <span>解析失败</span>
        </div>'''
          new_summary = '''        <p v-if="item.parse_status === 'completed' && !['pending', 'processing'].includes(String(item.summary_status || '')) && cardSummary(item)" class="reference-document-card__summary">{{ cardSummary(item) }}</p>

        <button v-if="isParseInFlight(item.parse_status)" type="button" class="reference-status-badge reference-status-badge--working reference-status-action" @click.stop="runAction('view-trace', item)">
          <ReferenceIcon name="loader-circle" :size="10" class="reference-spin" />
          <span>{{ inFlightStatusText(item) }}</span>
        </button>
        <button v-else-if="item.parse_status === 'failed'" type="button" class="reference-status-badge reference-status-badge--failed reference-status-action" @click.stop="runAction('view-trace', item)">
          <span>{{ t('knowledgeBase.parsingFailed') }}</span>
        </button>
        <div v-else-if="item.parse_status === 'draft'" class="reference-status-badge reference-status-badge--draft">
          <span>{{ t('knowledgeBase.draft') }}</span>
        </div>
        <div v-else-if="item.parse_status === 'completed' && ['pending', 'processing'].includes(String(item.summary_status || ''))" class="reference-status-badge reference-status-badge--working">
          <ReferenceIcon name="loader-circle" :size="10" class="reference-spin" />
          <span>{{ t('knowledgeBase.generatingSummary') }}</span>
        </div>'''
          s = once(s, old_summary, new_summary, 'card status lifecycle')
          s = once(s, '<span class="reference-document-card__extension">{{ getExtension(item) }}</span>', '<span class="reference-document-card__extension">{{ cardTypeLabel(item) }}</span>', 'card type label')
          s = once(s, '.reference-status-badge--failed {', '.reference-status-action { border: 0; cursor: pointer; text-align: left; font-family: inherit; }\n.reference-status-action:hover { filter: brightness(.96); }\n.reference-status-badge--draft { color: #b45309; background: #fffbeb; border-color: rgb(253 230 138 / .8); }\n.reference-status-badge--failed {', 'card status action css')
          p.write_text(s)
          PY
      - name: Commit document parity repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair required"
            exit 0
          fi
          git config user.name "musuw-parity-repair"
          git config user.email "actions@users.noreply.github.com"
          git add weknora/frontend/src/views/knowledge/components/DocumentCardView.vue \
                  weknora/frontend/src/views/knowledge/components/DocumentListView.vue
          git commit -m "fix: restore upstream document interaction semantics"
          git push origin HEAD:main
