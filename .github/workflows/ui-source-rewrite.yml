name: One-shot knowledge list regression repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ui-source-rewrite.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore upstream folder rows and downloads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          # 1) Restore the parent download bridge and permission props.
          kb_path = Path('weknora/frontend/src/views/knowledge/KnowledgeBase.vue')
          kb = kb_path.read_text()
          kb = replace_once(
              kb,
              '  getKnowledgeSpans,\n  listKnowledgeFolders,',
              '  getKnowledgeSpans,\n  downKnowledgeDetails,\n  listKnowledgeFolders,',
              'KnowledgeBase download API import',
          )
          kb = replace_once(
              kb,
              "} from './folderTree';\nimport { useI18n } from 'vue-i18n';",
              "} from './folderTree';\nimport { resolveKnowledgeDownloadFileName } from './knowledgeDownloadFileName';\nimport { useI18n } from 'vue-i18n';",
              'KnowledgeBase filename helper import',
          )
          bridge_anchor = "// Bridge card-view actions back to existing per-card handlers.\n"
          download_fn = """const downloadKnowledge = async (item: KnowledgeCard) => {\n  if (!item?.id) return;\n  try {\n    const file = await downKnowledgeDetails(item.id);\n    const objectUrl = URL.createObjectURL(file);\n    const link = document.createElement('a');\n    link.style.display = 'none';\n    link.href = objectUrl;\n    link.download = resolveKnowledgeDownloadFileName(item);\n    document.body.appendChild(link);\n    link.click();\n    nextTick(() => {\n      link.remove();\n      URL.revokeObjectURL(objectUrl);\n    });\n  } catch {\n    MessagePlugin.error(t('file.downloadFailed'));\n  }\n};\n\n"""
          kb = replace_once(kb, bridge_anchor, download_fn + bridge_anchor, 'KnowledgeBase download bridge insertion')
          action_union = "action: 'edit' | 'reparse' | 'cancel-parse' | 'move' | 'move-folder' | 'delete' | 'view-trace' | 'batch-manage',"
          if kb.count(action_union) != 2:
              raise SystemExit(f'unexpected KnowledgeBase action union count: {kb.count(action_union)}')
          kb = kb.replace(
              action_union,
              "action: 'download' | 'edit' | 'reparse' | 'cancel-parse' | 'move' | 'move-folder' | 'delete' | 'view-trace' | 'batch-manage',",
          )
          action_idx = "  const idx = (cardList.value || []).findIndex((i: KnowledgeCard) => i.id === item.id);\n  if (action === 'edit')"
          if kb.count(action_idx) != 2:
              raise SystemExit(f'unexpected KnowledgeBase action bridge count: {kb.count(action_idx)}')
          kb = kb.replace(
              action_idx,
              "  const idx = (cardList.value || []).findIndex((i: KnowledgeCard) => i.id === item.id);\n  if (action === 'download') return downloadKnowledge(item);\n  if (action === 'edit')",
          )
          kb = replace_once(
              kb,
              ':can-edit="canEdit"\n                    :can-mutate-knowledge="canMutateKnowledge"',
              ':can-edit="canEdit"\n                    :can-download="canDownloadKnowledge"\n                    :can-mutate-knowledge="canMutateKnowledge"',
              'card can-download prop',
          )
          kb = replace_once(
              kb,
              ':can-edit="canEdit" :can-mutate-knowledge="canMutateKnowledge"',
              ':can-edit="canEdit" :can-download="canDownloadKnowledge" :can-mutate-knowledge="canMutateKnowledge"',
              'list can-download prop',
          )
          kb_path.write_text(kb)

          # 2) Card view: preserve the visual DOM but restore upstream download semantics.
          card_path = Path('weknora/frontend/src/views/knowledge/components/DocumentCardView.vue')
          card = card_path.read_text()
          card = replace_once(
              card,
              '  canEdit: boolean\n  canMutateKnowledge: boolean',
              '  canEdit: boolean\n  canDownload: boolean\n  canMutateKnowledge: boolean',
              'card canDownload prop',
          )
          card = replace_once(
              card,
              "(e: 'action', action: 'edit' | 'view-trace' | 'reparse' | 'cancel-parse' | 'move' | 'move-folder' | 'batch-manage' | 'delete', item: KnowledgeCard): void",
              "(e: 'action', action: 'download' | 'edit' | 'view-trace' | 'reparse' | 'cancel-parse' | 'move' | 'move-folder' | 'batch-manage' | 'delete', item: KnowledgeCard): void",
              'card action union',
          )
          card = replace_once(
              card,
              "const runAction = (action: 'view-trace' | 'reparse' | 'cancel-parse' | 'move' | 'batch-manage' | 'delete', item: KnowledgeCard) => {",
              "const runAction = (action: 'download' | 'view-trace' | 'reparse' | 'cancel-parse' | 'move' | 'batch-manage' | 'delete', item: KnowledgeCard) => {",
              'card runAction union',
          )
          card = replace_once(
              card,
              '<div v-if="canEdit" class="reference-document-card__menu-anchor">',
              '<div v-if="canEdit || canDownload" class="reference-document-card__menu-anchor">',
              'card action menu availability',
          )
          normal_menu = '''              <div v-else class="reference-document-card__menu" @click.stop>\n                <button\n                  v-if="isTraceVisible(item)"'''
          normal_menu_repl = '''              <div v-else class="reference-document-card__menu" @click.stop>\n                <button\n                  v-if="canDownload && (item.type === 'file' || item.type === 'manual')"\n                  type="button"\n                  class="reference-menu-item"\n                  @click="runAction('download', item)"\n                >\n                  <svg viewBox="0 0 24 24" aria-hidden="true" class="reference-menu-inline-icon"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>\n                  <span>{{ t('common.download') }}</span>\n                </button>\n                <button\n                  v-if="canEdit && isTraceVisible(item)"'''
          card = replace_once(card, normal_menu, normal_menu_repl, 'card download menu item')
          card = replace_once(
              card,
              '<button type="button" class="reference-menu-item" @click="runAction(\'reparse\', item)">',
              '<button v-if="canEdit" type="button" class="reference-menu-item" @click="runAction(\'reparse\', item)">',
              'card reparse gate',
          )
          card = replace_once(
              card,
              'v-if="isParseInFlight(item.parse_status)"\n                  type="button"\n                  class="reference-menu-item reference-menu-item--warning"',
              'v-if="canEdit && isParseInFlight(item.parse_status)"\n                  type="button"\n                  class="reference-menu-item reference-menu-item--warning"',
              'card cancel gate',
          )
          card = replace_once(
              card,
              '<div class="reference-menu-divider" />\n                <button type="button" class="reference-menu-item reference-menu-item--danger" @click="runAction(\'delete\', item)">',
              '<div v-if="canEdit" class="reference-menu-divider" />\n                <button v-if="canEdit" type="button" class="reference-menu-item reference-menu-item--danger" @click="runAction(\'delete\', item)">',
              'card delete gate',
          )
          style_anchor = '.reference-menu-icon { flex: 0 0 auto; }'
          if style_anchor in card:
              card = card.replace(style_anchor, style_anchor + '\n.reference-menu-inline-icon { width: 14px; height: 14px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }', 1)
          card_path.write_text(card)

          # 3) List view: restore child-folder rows + download semantics.
          list_path = Path('weknora/frontend/src/views/knowledge/components/DocumentListView.vue')
          lst = list_path.read_text()
          lst = replace_once(
              lst,
              '  canEdit: boolean\n  canMutateKnowledge: boolean',
              '  canEdit: boolean\n  canDownload: boolean\n  canMutateKnowledge: boolean',
              'list canDownload prop',
          )
          lst = replace_once(
              lst,
              "(e: 'action', action: 'edit' | 'reparse' | 'cancel-parse' | 'move' | 'move-folder' | 'delete' | 'view-trace' | 'batch-manage', item: KnowledgeItem): void",
              "(e: 'action', action: 'download' | 'edit' | 'reparse' | 'cancel-parse' | 'move' | 'move-folder' | 'delete' | 'view-trace' | 'batch-manage', item: KnowledgeItem): void",
              'list action union',
          )
          lst = replace_once(
              lst,
              "const runAction = (action: 'reparse' | 'cancel-parse' | 'move' | 'delete' | 'view-trace' | 'batch-manage', item: KnowledgeItem) => {",
              "const runAction = (action: 'download' | 'reparse' | 'cancel-parse' | 'move' | 'delete' | 'view-trace' | 'batch-manage', item: KnowledgeItem) => {",
              'list runAction union',
          )
          tbody_anchor = '''        <tbody>\n          <tr\n            v-for="item in items"'''
          folder_rows = '''        <tbody>\n          <tr\n            v-for="folder in folders || []"\n            :key="`folder-${folder.path}`"\n            class="reference-folder-table-row"\n            :title="folder.path"\n            @click="emit('open-folder', folder.path)"\n          >\n            <td class="reference-col-check" aria-hidden="true"></td>\n            <td class="reference-file-cell">\n              <div class="reference-file-cell__wrap">\n                <div class="reference-file-cell__icon reference-file-cell__icon--folder">\n                  <ReferenceIcon name="folder" :size="16" />\n                </div>\n                <div class="reference-file-cell__copy">\n                  <h5 :title="folder.path">{{ folder.name }}</h5>\n                  <p>{{ t('knowledgeBase.folderTree.folderCardCount', { count: folder.total_count }) }}</p>\n                </div>\n              </div>\n            </td>\n            <td class="reference-col-tags"></td>\n            <td class="reference-col-source"></td>\n            <td class="reference-col-size"></td>\n            <td class="reference-col-status"></td>\n            <td class="reference-col-time"></td>\n            <td class="reference-col-action"></td>\n          </tr>\n\n          <tr\n            v-for="item in items"'''
          lst = replace_once(lst, tbody_anchor, folder_rows, 'list child folder rows')
          lst = replace_once(
              lst,
              '<button\n                  v-if="canEdit"\n                  type="button"\n                  class="reference-list-more"',
              '<button\n                  v-if="canEdit || canDownload"\n                  type="button"\n                  class="reference-list-more"',
              'list action menu availability',
          )
          lst = replace_once(
              lst,
              '<template v-if="canEdit && activeMenuItemId === item.id">',
              '<template v-if="(canEdit || canDownload) && activeMenuItemId === item.id">',
              'list menu template availability',
          )
          list_normal = '''                  <div v-else class="reference-list-menu">\n                    <button v-if="isTraceVisible(item)" type="button" class="reference-list-menu-item" @click="runAction('view-trace', item)">'''
          list_normal_repl = '''                  <div v-else class="reference-list-menu">\n                    <button\n                      v-if="canDownload && (item.type === 'file' || item.type === 'manual')"\n                      type="button"\n                      class="reference-list-menu-item"\n                      @click="runAction('download', item)"\n                    >\n                      <svg viewBox="0 0 24 24" aria-hidden="true" class="reference-list-menu-inline-icon"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>\n                      <span>{{ t('common.download') }}</span>\n                    </button>\n                    <button v-if="canEdit && isTraceVisible(item)" type="button" class="reference-list-menu-item" @click="runAction('view-trace', item)">'''
          lst = replace_once(lst, list_normal, list_normal_repl, 'list download menu item')
          lst = replace_once(
              lst,
              '<button type="button" class="reference-list-menu-item" @click="runAction(\'reparse\', item)">',
              '<button v-if="canEdit" type="button" class="reference-list-menu-item" @click="runAction(\'reparse\', item)">',
              'list reparse gate',
          )
          lst = replace_once(
              lst,
              'v-if="isParseInFlight(item.parse_status)"\n                      type="button"\n                      class="reference-list-menu-item reference-list-menu-item--warning"',
              'v-if="canEdit && isParseInFlight(item.parse_status)"\n                      type="button"\n                      class="reference-list-menu-item reference-list-menu-item--warning"',
              'list cancel gate',
          )
          lst = replace_once(
              lst,
              '<div class="reference-list-menu-divider" />\n                    <button type="button" class="reference-list-menu-item reference-list-menu-item--danger" @click="runAction(\'delete\', item)">',
              '<div v-if="canEdit" class="reference-list-menu-divider" />\n                    <button v-if="canEdit" type="button" class="reference-list-menu-item reference-list-menu-item--danger" @click="runAction(\'delete\', item)">',
              'list delete gate',
          )
          lst = replace_once(
              lst,
              '.reference-file-cell__icon {\n  width: 32px;',
              '.reference-file-cell__icon {\n  width: 32px;',
              'list icon style anchor',
          )
          style_insert = '.reference-list-folder-path {'
          if style_insert not in lst:
              raise SystemExit('missing list style insertion anchor')
          lst = lst.replace(
              style_insert,
              ".reference-folder-table-row { background: rgb(249 250 251 / 0.35); }\n.reference-folder-table-row:hover { background: #f3f4f6 !important; }\n.reference-file-cell__icon--folder { color: #6b7280; background: #f3f4f6; }\n.reference-list-menu-inline-icon { width: 14px; height: 14px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n" + style_insert,
              1,
          )
          list_path.write_text(lst)
          PY
      - name: Commit regression repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair required"
            exit 0
          fi
          git config user.name "musuw-regression-repair"
          git config user.email "actions@users.noreply.github.com"
          git add weknora/frontend/src/views/knowledge/KnowledgeBase.vue \
                  weknora/frontend/src/views/knowledge/components/DocumentCardView.vue \
                  weknora/frontend/src/views/knowledge/components/DocumentListView.vue
          git commit -m "fix: restore knowledge folder navigation and downloads"
          git push origin HEAD:main
